name: Option 3 - Prebuilt Kernel Tree BPF Repack
on:
  workflow_dispatch: {}

jobs:
  build-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflow Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl zip unzip cpio python3 python3-pip

      - name: Clone Infinix Zero 5G 2023 Prebuilt Kernel Tree
        run: |
          echo "Cloning Prebuilt Kernel Tree for Infinix Zero 5G 2023 (X6815D)..."
          git clone --depth=1 https://github.com/whoisgabutuniverseshit/device_infinix_X6815D-kernel prebuilt_tree

      - name: Create Work Directory & Download Stock Extracted Files
        run: |
          mkdir -p workdir
          echo "Downloading base stock files from MediaFire..."
          MEDIAFIRE_LINK="https://www.mediafire.com/file/oxhztcwpbqnqplq/all+things+here.zip/file"
          DIRECT_URL=$(curl -s "$MEDIAFIRE_LINK" | grep -o 'https://download[^"]*' | head -n 1)

          if [ -n "$DIRECT_URL" ]; then
            wget -O workdir/boot_contents.zip "$DIRECT_URL"
            cd workdir && unzip -o boot_contents.zip && cd ..
            find workdir -mindepth 2 -type f -exec mv {} workdir/ \; 2>/dev/null || true
          else
            echo "ERROR: MediaFire download failed!"
            exit 1
          fi

      - name: Setup Repack Tool (magiskboot)
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d workdir/
          mv workdir/lib/x86_64/libmagiskboot.so workdir/magiskboot
          rm -rf workdir/lib Magisk-v27.0.apk
          chmod +x workdir/magiskboot

      - name: Use Prebuilt Kernel Image & DTBs
        run: |
          echo "Merging Prebuilt Kernel and DTBs into workspace..."
          
          # Check and copy prebuilt kernel binary if available in the tree
          if [ -f "prebuilt_tree/kernel" ]; then
            cp prebuilt_tree/kernel workdir/kernel
            echo "Prebuilt kernel replaced successfully."
          elif [ -f "prebuilt_tree/Image.gz" ]; then
            cp prebuilt_tree/Image.gz workdir/kernel
            echo "Prebuilt Image.gz replaced successfully."
          fi

          # Copy dtb or dtbo if available in tree
          if [ -f "prebuilt_tree/dtb" ]; then
            cp prebuilt_tree/dtb workdir/dtb
          fi

      - name: Apply BPF Patches to Ramdisk
        working-directory: workdir
        run: |
          if [ -f "ramdisk.cpio" ]; then
            echo "Injecting BPF startup rules into ramdisk.cpio..."
            cat > init.bpf.rc << 'EOF'
          on early-init
              mkdir /sys/fs/bpf 0770 root system
              mount bpf bpf /sys/fs/bpf mode=0770,gid=1000

          on boot
              write /proc/sys/net/core/bpf_jit_enable 1
              write /proc/sys/net/core/bpf_jit_harden 0
              write /proc/sys/net/core/bpf_jit_kallsyms 1
          EOF

            ./magiskboot cpio ramdisk.cpio \
              "add 0755 init.bpf.rc init.bpf.rc" \
              "patch"
            echo "BPF ramdisk patch complete."
          else
            echo "Warning: ramdisk.cpio not found!"
          fi

      - name: Repack ColorOS A16 / Infinix Compatible Boot Image
        working-directory: workdir
        run: |
          if [ -f "boot.img" ]; then
            ./magiskboot repack boot.img patched_boot.img
          else
            ./magiskboot repack kernel patched_boot.img
          fi

          if [ -f "patched_boot.img" ]; then
            echo "Successfully repacked patched_boot.img!"
          elif [ -f "new-boot.img" ]; then
            mv new-boot.img patched_boot.img
            echo "Successfully repacked patched_boot.img!"
          else
            echo "ERROR: Repack failed!"
            exit 1
          fi

      - name: Prepare AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## Infinix Zero 5G 2023 — Prebuilt Tree BPF Boot

          properties() { '
          kernel.string=Infinix Zero 5G 2023 BPF Repacked Boot
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/patched_boot.img anykernel3/boot.img

          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          ZIP_NAME="InfinixZero5G2023-Option3-BPF-Boot.zip"
          zip -r9 "../$ZIP_NAME" . -x ".git/*"

      - name: Upload Repacked boot.img File
        uses: actions/upload-artifact@v4
        with:
          name: Option3-BPF-boot.img
          path: workdir/patched_boot.img

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Option3-BPF-Flashable-Zip
          path: InfinixZero5G2023-Option3-BPF-Boot.zip
