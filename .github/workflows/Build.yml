name: Build X6815C Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: 1
      LLVM_IAS: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # Automatically find the actual kernel source
      # ------------------------------------------------------------
      - name: Locate kernel source
        id: kernel
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd

          echo
          echo "Repository contents:"
          find . -maxdepth 3 -type d | sort

          echo
          echo "Searching for kernel source..."

          KERNEL_DIR=""

          # First preference: kernel-headers directory containing
          # a real kernel Makefile + arch + drivers.
          while IFS= read -r dir; do
            if [ -f "$dir/Makefile" ] && \
               [ -d "$dir/arch" ] && \
               [ -d "$dir/drivers" ] && \
               [ -d "$dir/include" ] && \
               [ -d "$dir/kernel" ] && \
               [ -d "$dir/mm" ] && \
               [ -d "$dir/net" ]; then

              KERNEL_DIR="$dir"
              break
            fi
          done < <(find . -type d -name "kernel-headers" -print)

          # If no kernel-headers directory matched, search all
          # directories for a complete kernel tree.
          if [ -z "$KERNEL_DIR" ]; then
            while IFS= read -r dir; do
              if [ -f "$dir/Makefile" ] && \
                 [ -d "$dir/arch" ] && \
                 [ -d "$dir/drivers" ] && \
                 [ -d "$dir/include" ] && \
                 [ -d "$dir/kernel" ] && \
                 [ -d "$dir/mm" ] && \
                 [ -d "$dir/net" ]; then

                KERNEL_DIR="$dir"
                break
              fi
            done < <(find . -type d -print)
          fi

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::Could not find a complete Linux kernel source tree."
            echo
            echo "Makefiles found:"
            find . -type f -name Makefile -print
            exit 1
          fi

          # Remove leading ./ for cleaner paths.
          KERNEL_DIR="${KERNEL_DIR#./}"

          echo
          echo "======================================"
          echo "Kernel source found:"
          echo "$KERNEL_DIR"
          echo "======================================"

          echo "kernel_dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Validate source
      # ------------------------------------------------------------
      - name: Verify kernel source
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Kernel directory:"
          pwd

          echo
          echo "Kernel tree:"
          ls -la

          echo
          echo "Checking required directories..."

          for d in arch block crypto drivers fs include init ipc kernel lib mm net scripts security; do
            if [ ! -d "$d" ]; then
              echo "::error::Missing kernel directory: $d"
              exit 1
            fi
          done

          if [ ! -f Makefile ]; then
            echo "::error::Kernel Makefile missing"
            exit 1
          fi

          echo
          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Kernel source verification successful."

      # ------------------------------------------------------------
      # Find defconfig
      # ------------------------------------------------------------
      - name: Find defconfig
        id: config
        shell: bash
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          cd "$KERNEL_DIR"

          echo "Searching arm64 defconfigs..."

          if [ ! -d arch/arm64/configs ]; then
            echo "::error::arch/arm64/configs does not exist."
            exit 1
          fi

          echo
          find arch/arm64/configs \
            -type f \
            -maxdepth 3 \
            -print | sort

          echo
          echo "Looking for X6815C / MT6877 configs..."

          MATCHES="$(
            find arch/arm64/configs \
              -type f \
              \( \
                -iname '*x6815*' \
                -o -iname '*mt6877*' \
                -o -iname '*dimensity*' \
              \) \
              -print \
              | sed 's#^arch/arm64/configs/##'
          )"

          if [ -z "$MATCHES" ]; then
            echo "::error::No X6815C/MT6877-specific defconfig found."

            echo
            echo "Available configs:"
            find arch/arm64/configs \
              -type f \
              -maxdepth 3 \
              -print \
              | sed 's#arch/arm64/configs/##' \
              | sort

            exit 1
          fi

          COUNT=$(echo "$MATCHES" | grep -c .)

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple possible device defconfigs found:"
            echo "$MATCHES"
            echo
            echo "Automatic selection stopped to prevent building the wrong configuration."
            exit 1
          fi

          DEFCONFIG="$MATCHES"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Prepare output directory
      # ------------------------------------------------------------
      - name: Prepare build directory
        run: |
          set -e

          rm -rf out
          mkdir -p out

      # ------------------------------------------------------------
      # Generate original configuration
      # ------------------------------------------------------------
      - name: Generate kernel configuration
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          DEFCONFIG="${{ steps.config.outputs.defconfig }}"

          cd "$KERNEL_DIR"

          echo "Using defconfig:"
          echo "$DEFCONFIG"

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            "$DEFCONFIG"

      # ------------------------------------------------------------
      # Enable BPF
      # ------------------------------------------------------------
      - name: Enable BPF
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          cd "$KERNEL_DIR"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Generated .config does not exist."
            exit 1
          fi

          echo "Enabling BPF..."

          ./scripts/config --file "$CONFIG" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT

          # Enable optional BPF functionality only if the symbol
          # exists in this particular kernel tree.
          if grep -Rqs '^config BPF_EVENTS' kernel include; then
            ./scripts/config --file "$CONFIG" --enable BPF_EVENTS || true
          fi

          if grep -Rqs '^config CGROUP_BPF' .; then
            ./scripts/config --file "$CONFIG" --enable CGROUP_BPF || true
          fi

          echo
          echo "Resolving config dependencies..."

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          echo
          echo "========== BPF CONFIG =========="

          grep -E \
            '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_BPF_EVENTS|CONFIG_CGROUP_BPF)=' \
            "$CONFIG" || true

      # ------------------------------------------------------------
      # KernelSU
      # ------------------------------------------------------------
      - name: Integrate KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Installing KernelSU v0.9.5..."

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash

          echo
          echo "Checking KernelSU..."

          if [ ! -d KernelSU ]; then
            echo "::error::KernelSU integration failed."
            exit 1
          fi

          echo "KernelSU integrated successfully."

      # ------------------------------------------------------------
      # Re-resolve config after KernelSU
      # ------------------------------------------------------------
      - name: Configure KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          cd "$KERNEL_DIR"

          if grep -Rqs '^config KSU' KernelSU; then
            ./scripts/config --file "$CONFIG" --enable KSU
          fi

          # Needed by many non-GKI KernelSU configurations.
          ./scripts/config --file "$CONFIG" \
            --enable KPROBES || true

          ./scripts/config --file "$CONFIG" \
            --enable KPROBE_EVENTS || true

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          echo
          echo "========== FINAL CONFIG =========="

          grep -E \
            '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            "$CONFIG" || true

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Starting kernel compilation..."

          make \
            -j"$(nproc --all)" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            modules

      # ------------------------------------------------------------
      # Verify
      # ------------------------------------------------------------
      - name: Verify build
        run: |
          set -e

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz was not generated."
            exit 1
          fi

          echo "======================================"
          echo "KERNEL BUILD SUCCESSFUL"
          echo "======================================"

          ls -lh out/arch/arm64/boot/Image.gz

      # ------------------------------------------------------------
      # Package artifacts
      # ------------------------------------------------------------
      - name: Package artifacts
        run: |
          set -e

          mkdir -p artifacts

          cp out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp out/.config \
            artifacts/kernel.config

          if [ -f out/include/config/kernel.release ]; then
            cp out/include/config/kernel.release \
              artifacts/kernel.release
          fi

          # Collect DTBs.
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp {} artifacts/ \;
          fi

          # Collect DTBOs if the kernel build produced any.
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp {} artifacts/ \;
          fi

          cat > artifacts/BUILD_INFO.txt <<EOF
          Device: Infinix X6815C
          Architecture: arm64
          KernelSU: v0.9.5
          BPF: enabled
          Build date: $(date -u)
          Kernel release: $(cat out/include/config/kernel.release 2>/dev/null || echo unknown)
          EOF

          echo
          echo "========== FINAL ARTIFACTS =========="
          ls -lah artifacts

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-KernelSU-BPF
          path: artifacts/
          if-no-files-found: error
