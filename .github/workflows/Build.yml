name: Build Infinix X6815C Kernel with KernelSU & BPF

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/minimize-discussion-space@v2
        with:
          root-reserve-mb: 2048
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm graphviz git zip unzip python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com kernel-source
          
      - name: Clone Toolchain (AOSP Clang & GCC)
        run: |
          mkdir toolchains
          cd toolchains
          # Download Proton Clang or AOSP Clang. Standard AOSP Clang 12/13 is preferred for 4.14/4.19 kernels.
          git clone --depth=1 https://googlesource.com clang
          # Download AOSP GCC for standard cross-compilation linking
          git clone --depth=1 -b android-12.0.0_r1 https://googlesource.com gcc64
          git clone --depth=1 -b android-12.0.0_r1 https://googlesource.com gcc32

      - name: Setup KernelSU
        run: |
          cd kernel-source
          # Integrate KernelSU directly via their official setup script
          curl -LSs "https://githubusercontent.com" | bash -s main

      - name: Patch BPF Configurations
        run: |
          cd kernel-source
          # Note: Infinix X6815C config file usually resides in arch/arm64/configs/
          # Replace 'vendor/x6815c_defconfig' with your exact defconfig name if it differs
          TARGET_DEFCONFIG="arch/arm64/configs/vendor/x6815c_defconfig"
          
          echo "Appending BPF configurations to $TARGET_DEFCONFIG..."
          cat <<EOF >> $TARGET_DEFCONFIG
          # BPF Patches for KernelSU / Modules
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          EOF

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          # Setup paths to toolchains
          export PATH=$(pwd)/../toolchains/clang/bin:$(pwd)/../toolchains/gcc64/bin:$(pwd)/../toolchains/gcc32/bin:$PATH
          
          # Environment variables
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # 1. Regenerate defconfig
          # Adjust defconfig filename if yours is named differently
          make O=out vendor/x6815c_defconfig
          
          # 2. Build the kernel
          make -j$(nproc --all) O=out

      - name: Package Output (AnyKernel3)
        run: |
          # Clone a generic AnyKernel3 flashable template
          git clone --depth=1 https://github.com AnyKernel3
          
          # Target binary search
          if [ -f "kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          
          # Zip it up
          cd AnyKernel3
          zip -r ../Infinix_X6815C_KernelSU_BPF.zip *

      - name: Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-X6815C-Kernel
          path: Infinix_X6815C_KernelSU_BPF.zip
