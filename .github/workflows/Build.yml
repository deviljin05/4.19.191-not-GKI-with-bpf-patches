name: Pure Native MT6877 Kernel Build
on:
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl wget zip unzip cpio python3 python3-pip dos2unix

      - name: Clone Xiaomi MT6877 Official Kernel Source
        run: |
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b ruby-s-oss kernel_src

      - name: Download Official AOSP Developer Toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # Official AOSP Clang r416183b
          echo "Downloading Official AOSP Clang..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          mkdir clang && tar -xf clang-r416183b.tar.gz -C clang

          # Official AOSP GCC 4.9 Cross-Compilers
          echo "Downloading Official AOSP GCC 64-bit..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz -O gcc64.tar.gz
          mkdir gcc64 && tar -xf gcc64.tar.gz -C gcc64

          echo "Downloading Official AOSP GCC 32-bit..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android12-release.tar.gz -O gcc32.tar.gz
          mkdir gcc32 && tar -xf gcc32.tar.gz -C gcc32

      - name: Sanitize Kconfig Files & Stock Defconfig Setup
        run: |
          cd kernel_src
          
          # Fix DOS line-endings in Kconfig files (prevents syncconfig crash)
          find . -type f -name "Kconfig*" -exec dos2unix {} +

          DEFCONFIG=""
          if [ -f "arch/arm64/configs/ruby_defconfig" ]; then
            DEFCONFIG="ruby_defconfig"
          elif [ -f "arch/arm64/configs/mt6877_defconfig" ]; then
            DEFCONFIG="mt6877_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          export ARCH=arm64
          make $DEFCONFIG

          # Standard BPF Options Injection
          cat << 'EOF' >> .config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF_LSM=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TRACEPOINTS=y
          EOF

          make olddefconfig

      - name: Compile Kernel (Native AOSP Clang + GCC Pipeline)
        run: |
          cd kernel_src
          
          CLANG_DIR="$(pwd)/../toolchains/clang/bin"
          GCC64_DIR="$(pwd)/../toolchains/gcc64/bin"
          GCC32_DIR="$(pwd)/../toolchains/gcc32/bin"
          
          export PATH="${CLANG_DIR}:${GCC64_DIR}:${GCC32_DIR}:${PATH}"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          make -j$(nproc --all) Image.gz || make -j$(nproc --all) Image

      - name: Verify Output Binary
        run: |
          if [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            echo "SUCCESS: Pure Image.gz compiled successfully!"
            mkdir -p workdir
            cp kernel_src/arch/arm64/boot/Image.gz workdir/kernel
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            echo "SUCCESS: Pure Image compiled successfully!"
            mkdir -p workdir
            cp kernel_src/arch/arm64/boot/Image workdir/kernel
          else
            echo "ERROR: Kernel compilation failed."
            exit 1
          fi

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## MT6877 Native Developer Kernel

          properties() { '
          kernel.string=MT6877 Native Developer Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/kernel anykernel3/Image.gz 2>/dev/null || cp workdir/kernel anykernel3/Image
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          zip -r9 "../MT6877-Developer-Native-Kernel.zip" . -x ".git/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT6877-Developer-Native-Kernel
          path: MT6877-Developer-Native-Kernel.zip
