name: Official Xiaomi MT6877 Native Kernel Build
on:
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl wget zip unzip cpio python3 python3-pip clang llvm lld

      - name: Clone Xiaomi MT6877 Official Kernel Source
        run: |
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b ruby-s-oss kernel_src

      - name: Download Official Xiaomi-Targeted Toolchains
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # 1. Official Android Clang r416183b (Exact version used for Android 12 MT6877 Kernels)
          echo "Downloading Official AOSP Clang r416183b..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          mkdir clang && tar -xf clang-r416183b.tar.gz -C clang
          
          # 2. Official AArch64 GCC 4.9 Cross-Compiler
          echo "Downloading GCC 64-bit..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          
          # 3. Official ARM32 GCC 4.9 Cross-Compiler
          echo "Downloading GCC 32-bit..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Setup Stock Defconfig & Pure BPF Flags
        run: |
          cd kernel_src
          
          DEFCONFIG=""
          if [ -f "arch/arm64/configs/ruby_defconfig" ]; then
            DEFCONFIG="ruby_defconfig"
          elif [ -f "arch/arm64/configs/mt6877_defconfig" ]; then
            DEFCONFIG="mt6877_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          export ARCH=arm64
          make $DEFCONFIG

          # Standard BPF Configuration (Without touching kernel C code)
          cat << 'EOF' >> .config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF_LSM=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TRACEPOINTS=y
          EOF

          make olddefconfig

      - name: Compile Kernel (Official Clang + GCC Assembly Pipeline)
        run: |
          cd kernel_src
          
          CLANG_DIR="$(pwd)/../toolchains/clang/bin"
          GCC64_DIR="$(pwd)/../toolchains/gcc64/bin"
          GCC32_DIR="$(pwd)/../toolchains/gcc32/bin"
          
          export PATH="${CLANG_DIR}:${GCC64_DIR}:${GCC32_DIR}:${PATH}"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Pure compilation using Xiaomi's exact environment flags
          make -j$(nproc --all) Image.gz || make -j$(nproc --all) Image

      - name: Verify Compiled Output
        run: |
          if [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            echo "SUCCESS: Pure Image.gz compiled successfully!"
            mkdir -p workdir
            cp kernel_src/arch/arm64/boot/Image.gz workdir/kernel
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            echo "SUCCESS: Pure Image compiled successfully!"
            mkdir -p workdir
            cp kernel_src/arch/arm64/boot/Image workdir/kernel
          else
            echo "ERROR: Kernel compilation failed. Check build logs."
            exit 1
          fi

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## MT6877 Official Clang Native Kernel

          properties() { '
          kernel.string=MT6877 Official Clang Native Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/kernel anykernel3/Image.gz 2>/dev/null || cp workdir/kernel anykernel3/Image
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          zip -r9 "../MT6877-Official-Native-Kernel.zip" . -x ".git/*"

      - name: Upload Final Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT6877-Official-Native-Kernel
          path: MT6877-Official-Native-Kernel.zip
