name: Build X6815C Kernel (Production MTK)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch"
        required: false
        default: "main"
      enable_bpf:
        description: "Enable BPF configs + apply patches"
        type: boolean
        default: true
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 rsync unzip zip xz-utils \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zstd

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi

      - name: Smart Source Auto-Fix
        working-directory: kernel
        run: |
          echo "🔍 Checking for broken KernelSU leftovers..."
          if [ ! -d "drivers/kernelsu" ]; then
            sed -i '/drivers\/kernelsu/d' drivers/Kconfig || true
            sed -i '/kernelsu/d' drivers/Makefile || true
          fi

      - name: Resolve defconfig
        working-directory: kernel
        run: |
          DC=$(ls arch/arm64/configs | grep -iE 'x6815c|6877' | head -n1 || true)
          [ -z "$DC" ] && DC=$(ls arch/arm64/configs | grep -iE 'defconfig' | head -n1)
          test -f "arch/arm64/configs/$DC" || { echo "::error::No defconfig found"; exit 1; }
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"
          echo "✅ Using Defconfig: $DC"

      - name: Set up toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Apply BPF patches
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          shopt -s nullglob
          PATCHES=("$GITHUB_WORKSPACE"/patches/bpf/*.patch)
          for p in "${PATCHES[@]}"; do
            git apply "$p" || echo "::warning::Patch failed: $p"
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          BPF: ${{ inputs.enable_bpf }}
        run: |
          : > ci.config
          
          cat >> ci.config <<'EOF'
          CONFIG_MODULE_SIG=n
          CONFIG_SYSTEM_TRUSTED_KEYS=""
          CONFIG_DEBUG_INFO=n
          CONFIG_LTO_NONE=y
          CONFIG_WERROR=n
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          CONFIG_MTK_COMBO_WIFI_HIF=sdio
          CONFIG_MODULES=y
          EOF

          if [ "$BPF" = "true" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF
          fi
          
          sed -i 's/^ *//' ci.config
          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config ci.config
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build kernel & Modules
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            WIFI_HIF=sdio \
            MTK_COMBO_CHIP=MT6632 \
            2>&1 | tee build.log

      - name: Collect Outputs (Image, DTB, Modules)
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          D="$GITHUB_WORKSPACE/dist"
          
          # 1. Handle Kernel Image & DTB
          if [ -f "$B/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb found."
            cp "$B/Image.gz-dtb" "$D/"
          elif [ -f "$B/Image.gz" ]; then
            echo "⚠️ Image.gz found. Checking DTB..."
            cp "$B/Image.gz" "$D/"
            if [ -f "$B/dtb" ]; then
              cp "$B/dtb" "$D/dtb"
            fi
          elif [ -f "$B/Image" ]; then
            echo "✅ Image found."
            cp "$B/Image" "$D/"
          else
            echo "::error::❌ No Kernel Image produced."
            exit 1
          fi
          
          # 2. Handle Modules (.ko) for MTK
          echo "🔍 Finding .ko modules..."
          find out -name "*.ko" -exec cp {} "$D/" \; 2>/dev/null || true
          
          cp out/.config "$D/final.config"
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 (Modules + DTB)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          D="$GITHUB_WORKSPACE/dist"
          
          # Copy Image
          if [ -f "$D/Image.gz-dtb" ]; then
            cp "$D/Image.gz-dtb" ak3/
          elif [ -f "$D/Image.gz" ]; then
            cp "$D/Image.gz" ak3/
          else
            cp "$D/Image" ak3/
          fi
          
          # Copy DTB if separate
          [ -f "$D/dtb" ] && cp "$D/dtb" ak3/
          
          # Inject Modules into AnyKernel3
          if ls "$D"/*.ko >/dev/null 2>&1; then
            mkdir -p ak3/modules
            cp "$D"/*.ko ak3/modules/
            echo "✅ Modules added to AnyKernel3."
          fi
          
          # Update AnyKernel3 Script
          sed -i \
            -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER} (Production)|" \
            -e "s|^do.devicecheck=.*|do.devicecheck=0|" \
            -e "s|^do.modules=.*|do.modules=1|" \
            -e "s|^BLOCK=.*|BLOCK=boot;|" \
            ak3/anykernel.sh
            
          ZIP="X6815C-${KVER}-Production.zip"
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*.git*')

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-production-build
          path: dist/*

      - name: Publish Release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x6815c-${{ github.run_number }}
          name: X6815C ${{ env.KVER }} (Production)
          files: dist/*.zip
