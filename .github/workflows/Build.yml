name: Unzip Extracted Boot & Apply BPF Patches
on:
  workflow_dispatch: {}

jobs:
  repack-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl zip unzip cpio python3 python3-pip
          pip3 install --upgrade gdown

      - name: Create Work Directory & Download Zip
        run: |
          mkdir -p workdir
          echo "Downloading zip file from Google Drive..."
          gdown --fuzzy "https://drive.google.com/file/d/1eZ2keU1kRgG64cgciC9V-808RBP2iYoc/view?usp=sharing" -O workdir/boot_contents.zip || true

          if [ ! -f "workdir/boot_contents.zip" ]; then
            echo "ERROR: Google Drive se ZIP download nahi ho saki! Link permissions (Anyone with link) check karein."
            exit 1
          fi

      - name: Extract Zip Contents
        working-directory: workdir
        run: |
          echo "Unzipping uploaded archive..."
          unzip -o boot_contents.zip
          
          # Nested sub-folders handling
          find . -mindepth 2 -type f -exec mv {} . \; 2>/dev/null || true
          
          echo "Extracted directory contents:"
          ls -la

      - name: Setup Repack Tool (magiskboot)
        run: |
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d workdir/
          mv workdir/lib/x86_64/libmagiskboot.so workdir/magiskboot
          rm -rf workdir/lib Magisk-v27.0.apk
          chmod +x workdir/magiskboot

      - name: Unpack boot.img (If present as image file)
        working-directory: workdir
        run: |
          if [ -f "boot.img" ] && [ ! -f "ramdisk.cpio" ]; then
            echo "Unpacking boot.img file..."
            ./magiskboot unpack boot.img
          fi

      - name: Apply BPF Init Configurations to Ramdisk
        working-directory: workdir
        run: |
          if [ -f "ramdisk.cpio" ]; then
            echo "Injecting BPF startup rules into ramdisk.cpio..."
            cat > init.bpf.rc << 'EOF'
          on early-init
              mkdir /sys/fs/bpf 0770 root system
              mount bpf bpf /sys/fs/bpf mode=0770,gid=1000

          on boot
              write /proc/sys/net/core/bpf_jit_enable 1
              write /proc/sys/net/core/bpf_jit_harden 0
              write /proc/sys/net/core/bpf_jit_kallsyms 1
          EOF

            ./magiskboot cpio ramdisk.cpio \
              "add 0755 init.bpf.rc init.bpf.rc" \
              "patch"
          else
            echo "Warning: ramdisk.cpio nahi mili!"
          fi

      - name: Repack Patched Boot Image
        working-directory: workdir
        run: |
          if [ -f "boot.img" ]; then
            ./magiskboot repack boot.img patched_boot.img
          else
            ./magiskboot repack kernel patched_boot.img
          fi

          if [ -f "patched_boot.img" ]; then
            echo "Successfully repacked patched_boot.img!"
          elif [ -f "new-boot.img" ]; then
            mv new-boot.img patched_boot.img
            echo "Successfully repacked patched_boot.img!"
          else
            echo "ERROR: Repack process fail ho gaya!"
            exit 1
          fi

      - name: Prepare Clean AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## Infinix Zero 5G 2023 — BPF Patched Boot (Repacked)

          properties() { '
          kernel.string=Infinix Zero 5G 2023 BPF Repacked Boot
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/patched_boot.img anykernel3/boot.img

          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          ZIP_NAME="InfinixZero5G2023-BPF-Patched-Boot.zip"
          zip -r9 "../$ZIP_NAME" . -x ".git/*"

      - name: Upload Repacked boot.img File
        uses: actions/upload-artifact@v4
        with:
          name: BPF-Patched-boot.img
          path: workdir/patched_boot.img

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero-5G-2023-BPF-Zip
          path: InfinixZero5G2023-BPF-Patched-Boot.zip
