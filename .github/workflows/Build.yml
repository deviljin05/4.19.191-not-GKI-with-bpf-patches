name: Build X6815C Kernel (Clean BPF)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch (empty = repo default)"
        required: false
        default: "main"
      defconfig:
        description: "Defconfig name (auto = detect)"
        required: true
        default: "auto"
      extra_config:
        description: "Extra Kconfig lines separated by ;"
        required: false
        default: "CONFIG_LOCALVERSION=\"-BPF\""
      enable_bpf:
        description: "Enable BPF configs + apply patches/bpf/*.patch"
        type: boolean
        default: true
      extra_patch_urls:
        description: "Extra .patch URLs (space separated)"
        required: false
        default: ""
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo (for patches/)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 rsync unzip zip xz-utils \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zstd

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi
          cd kernel
          echo "Commit: $(git log -1 --format='%h %s')"

      - name: Ensure KernelSU is fully removed
        working-directory: kernel
        run: |
          # 1. Remove the directory
          if [ -d "drivers/kernelsu" ]; then
            echo "Removing leftover KernelSU drivers..."
            rm -rf drivers/kernelsu
          fi
          
          # 2. Remove the Makefile entry
          sed -i '/kernelsu/d' drivers/Makefile
          
          # 3. Remove the Kconfig entry (This fixes the current error)
          if grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            echo "Removing KernelSU entry from drivers/Kconfig..."
            sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig
          fi

      - name: Resolve defconfig
        working-directory: kernel
        env:
          DEFCONFIG_IN: ${{ inputs.defconfig }}
        run: |
          if [ "$DEFCONFIG_IN" = "auto" ]; then
            DC=$(ls arch/arm64/configs | grep -iE 'x6815c|6877' | head -n1 || true)
            [ -n "$DC" ] || { echo "::error::Could not auto-detect defconfig"; exit 1; }
          else
            DC="$DEFCONFIG_IN"
          fi
          test -f "arch/arm64/configs/$DC" || { echo "::error::arch/arm64/configs/$DC not found"; exit 1; }
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"

      - name: Set up toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Apply BPF patches
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          shopt -s nullglob
          PATCHES=("$GITHUB_WORKSPACE"/patches/bpf/*.patch)
          for p in "${PATCHES[@]}"; do
            echo ">> Applying $(basename "$p")"
            git apply "$p" || echo "::warning::Patch failed: $p (skipping)"
          done

      - name: Apply extra patches
        if: ${{ inputs.extra_patch_urls != '' }}
        working-directory: kernel
        env:
          URLS: ${{ inputs.extra_patch_urls }}
        run: |
          for u in $URLS; do
            curl -fLsS "$u" -o /tmp/extra.patch
            git apply /tmp/extra.patch || echo "::warning::Patch failed: $u"
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          BPF: ${{ inputs.enable_bpf }}
          EXTRA: ${{ inputs.extra_config }}
        run: |
          : > ci.config
          
          cat >> ci.config <<'EOF'
          CONFIG_MODULE_SIG=n
          CONFIG_SYSTEM_TRUSTED_KEYS=""
          CONFIG_DEBUG_INFO=n
          CONFIG_LTO_NONE=y
          CONFIG_WERROR=n
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          CONFIG_MTK_COMBO_WIFI_HIF=sdio
          EOF

          if [ "$BPF" = "true" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF
          fi
          
          if [ -n "$EXTRA" ]; then
            echo "$EXTRA" | tr ';' '\n' >> ci.config
          fi
          sed -i 's/^ *//' ci.config

          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config ci.config
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          START=$(date +%s)
          
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            WIFI_HIF=sdio \
            MTK_COMBO_CHIP=MT6632 \
            2>&1 | tee build.log
            
          echo "BUILD_SECS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          ccache -s

      - name: Verify Outputs & Collect
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          
          if [ -f "$B/Image.gz-dtb" ]; then
            echo "::notice::Image.gz-dtb found. Phone will boot."
            cp "$B/Image.gz-dtb" "$GITHUB_WORKSPACE/dist/"
          elif [ -f "$B/Image.gz" ]; then
            echo "::warning::Image.gz found. DTB needs to be appended manually."
            cp "$B/Image.gz" "$GITHUB_WORKSPACE/dist/"
          else
            echo "::error::No Image produced. Build failed."
            exit 1
          fi
          
          cp out/.config "$GITHUB_WORKSPACE/dist/final.config"
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          D="$GITHUB_WORKSPACE/dist"
          
          if [ -f "$D/Image.gz-dtb" ]; then
            cp "$D/Image.gz-dtb" ak3/
          else
            cp "$D/Image.gz" ak3/
            if ls "$D"/*.dtb >/dev/null 2>&1; then
              cat "$D"/*.dtb > ak3/dtb
            fi
          fi
          
          sed -i \
            -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER} (BPF)|" \
            -e "s|^do.devicecheck=.*|do.devicecheck=0|" \
            -e "s|^do.modules=.*|do.modules=0|" \
            -e "s|^BLOCK=.*|BLOCK=boot;|" \
            -e "s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|" \
            ak3/anykernel.sh
            
          ZIP="X6815C-${KVER}-BPF-$(date +%Y%m%d-%H%M).zip"
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*.git*')
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-kernel-${{ github.run_number }}
          path: dist/*
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
