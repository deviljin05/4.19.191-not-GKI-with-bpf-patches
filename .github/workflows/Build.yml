name: Build X6815C Kernel (KernelSU-Next + BPF)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch (empty = repo default)"
        required: false
        default: "main"
      defconfig:
        description: "Defconfig name (auto = detect from arch/arm64/configs)"
        required: true
        default: "auto"
      extra_config:
        description: "Extra Kconfig lines, separated by ; (e.g. CONFIG_FOO=n;CONFIG_BAR=y)"
        required: false
        default: ""
      ksu:
        description: "KernelSU variant"
        type: choice
        options: [next, none]
        default: next
      enable_bpf:
        description: "Enable BPF configs + apply patches/bpf/*.patch"
        type: boolean
        default: true
      extra_patch_urls:
        description: "Extra .patch URLs (space separated, applied after BPF patches)"
        required: false
        default: ""
      clang_repo:
        description: "Clang toolchain git repo"
        required: true
        default: "https://github.com/kdrag0n/proton-clang"
      anykernel_repo:
        description: "AnyKernel3 repo"
        required: true
        default: "https://github.com/osm0sis/AnyKernel3"
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo (for patches/)
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 rsync unzip zip xz-utils \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zstd

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi
          cd kernel
          echo "Commit: $(git log -1 --format='%h %s')"

      - name: Verify kernel source is buildable
        working-directory: kernel
        run: |
          test -f Makefile || { echo "::error::No top-level Makefile - not a kernel tree"; exit 1; }
          C_COUNT=$(find kernel drivers arch/arm64 -name '*.c' 2>/dev/null | wc -l)
          echo "C files found: $C_COUNT"
          [ "$C_COUNT" -gt 100 ] || { echo "::error::Repo has no real kernel source (only headers/prebuilts?)"; exit 1; }
          make kernelversion
          ls arch/arm64/configs | head -50

      - name: Resolve defconfig
        working-directory: kernel
        env:
          DEFCONFIG_IN: ${{ inputs.defconfig }}
        run: |
          if [ "$DEFCONFIG_IN" = "auto" ]; then
            DC=$(ls arch/arm64/configs | grep -iE 'x6815c|6877' | head -n1 || true)
            [ -n "$DC" ] || { echo "::error::Could not auto-detect defconfig, pass it manually"; exit 1; }
          else
            DC="$DEFCONFIG_IN"
          fi
          test -f "arch/arm64/configs/$DC" || { echo "::error::arch/arm64/configs/$DC not found"; exit 1; }
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"
          echo "Using defconfig: $DC"

      - name: Set up toolchain
        env:
          CLANG_REPO: ${{ inputs.clang_repo }}
        run: |
          git clone --depth=1 "$CLANG_REPO" "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version | head -n1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Integrate KernelSU-Next
        if: ${{ inputs.ksu == 'next' }}
        working-directory: kernel
        run: |
          # Non-GKI kernel (4.19) requires the "legacy" setup argument.
          # Using "next" here will fail to patch correctly.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
          test -d drivers/kernelsu || test -d KernelSU-Next || { echo "::error::KernelSU-Next setup failed"; exit 1; }
          git status --short | head -20

      - name: Apply BPF patches
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          shopt -s nullglob
          PATCHES=("$GITHUB_WORKSPACE"/patches/bpf/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "::warning::No patches/bpf/*.patch found - only BPF kernel configs will be enabled"
          fi
          for p in "${PATCHES[@]}"; do
            echo ">> $(basename "$p")"
            if git apply --check "$p" 2>/dev/null; then
              git apply "$p"
            else
              patch -p1 --dry-run < "$p" >/dev/null || { echo "::error::Patch failed: $p"; exit 1; }
              patch -p1 < "$p"
            fi
          done

      - name: Apply extra patches
        if: ${{ inputs.extra_patch_urls != '' }}
        working-directory: kernel
        env:
          URLS: ${{ inputs.extra_patch_urls }}
        run: |
          for u in $URLS; do
            curl -fLsS "$u" -o /tmp/extra.patch
            git apply --check /tmp/extra.patch || { echo "::error::Patch failed: $u"; exit 1; }
            git apply /tmp/extra.patch
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          KSU: ${{ inputs.ksu }}
          BPF: ${{ inputs.enable_bpf }}
          EXTRA: ${{ inputs.extra_config }}
        run: |
          : > ci.config
          if [ "$KSU" = "next" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_MODULES=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          EOF
          fi
          if [ "$BPF" = "true" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF
          fi
          if [ -n "$EXTRA" ]; then
            echo "$EXTRA" | tr ';' '\n' >> ci.config
          fi
          sed -i 's/^ *//' ci.config

          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config ci.config
          make O=out ARCH=arm64 CC=clang olddefconfig

          echo "---- platform / wifi diagnostics ----"
          grep -E 'CONFIG_MTK_PLATFORM|COMBO|WIFI_HIF|MTK_WLAN|CONNAC|CONFIG_WLAN' out/.config || true

          echo "---- config verification ----"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            grep -qx "$line" out/.config || echo "::warning::Not applied: $line"
          done < ci.config

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G
          START=$(date +%s)
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            2>&1 | tee build.log
          echo "BUILD_SECS=$(( $(date +%s) - START ))" >> "$GITHUB_ENV"
          ccache -s

      - name: Collect outputs
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          ls -la "$B"
          for f in Image Image.gz Image.gz-dtb; do
            [ -f "$B/$f" ] && cp "$B/$f" "$GITHUB_WORKSPACE/dist/"
          done
          find "$B/dts" -name '*.dtb' -exec cp {} "$GITHUB_WORKSPACE/dist/" \; 2>/dev/null || true
          find "$B/dts" -name '*.dtbo' -exec cp {} "$GITHUB_WORKSPACE/dist/" \; 2>/dev/null || true
          cp out/.config "$GITHUB_WORKSPACE/dist/final.config"
          [ -f "$GITHUB_WORKSPACE/dist/Image.gz-dtb" ] || [ -f "$GITHUB_WORKSPACE/dist/Image.gz" ] || [ -f "$GITHUB_WORKSPACE/dist/Image" ] \
            || { echo "::error::No kernel image produced"; exit 1; }
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 zip
        env:
          AK_REPO: ${{ inputs.anykernel_repo }}
          KSU: ${{ inputs.ksu }}
        run: |
          git clone --depth=1 "$AK_REPO" ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          D="$GITHUB_WORKSPACE/dist"
          if   [ -f "$D/Image.gz-dtb" ]; then cp "$D/Image.gz-dtb" ak3/
          elif [ -f "$D/Image.gz" ];     then cp "$D/Image.gz" ak3/
          else cp "$D/Image" ak3/; fi
          if ! [ -f "$D/Image.gz-dtb" ] && ls "$D"/*.dtb >/dev/null 2>&1; then
            cat "$D"/*.dtb > ak3/dtb
          fi
          sed -i \
            -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER} (KernelSU: ${KSU})|" \
            -e "s|^do.devicecheck=.*|do.devicecheck=0|" \
            -e "s|^do.modules=.*|do.modules=0|" \
            -e "s|^BLOCK=.*|BLOCK=auto;|" \
            -e "s|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|" \
            ak3/anykernel.sh
          ZIP="X6815C-${KVER}-KSU-${KSU}-$(date +%Y%m%d-%H%M).zip"
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*.git*')
          echo "ZIP_NAME=$ZIP" >> "$GITHUB_ENV"

      - name: Job summary
        run: |
          {
            echo "### X6815C kernel build"
            echo "- Version: \`$KVER\`"
            echo "- Defconfig: \`$DEFCONFIG\`"
            echo "- KernelSU: \`${{ inputs.ksu }}\` | BPF: \`${{ inputs.enable_bpf }}\`"
            echo "- Build time: $((BUILD_SECS/60)) min"
            echo "- Zip: \`$ZIP_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-kernel-${{ github.run_number }}
          path: dist/*
          retention-days: 14

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Publish release
        if: ${{ inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x6815c-${{ github.run_number }}
          name: X6815C ${{ env.KVER }} (build ${{ github.run_number }})
          files: dist/${{ env.ZIP_NAME }}
