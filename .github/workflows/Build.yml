name: Build X6815C Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig path/name. Leave empty for auto-detect."
        required: false
        default: ""
      kernelsu:
        description: "Build with KernelSU v0.9.5"
        required: true
        default: "true"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: kernel-headers
      ARCH: arm64
      SUBARCH: arm64
      KSU_VERSION: v0.9.5

    steps:
      # ------------------------------------------------------------
      # Source
      # ------------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            libncurses5-dev \
            libncurses-dev \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ------------------------------------------------------------
      # Check kernel source
      # ------------------------------------------------------------
      - name: Verify kernel source
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "Kernel source:"
          pwd

          echo
          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Checking source directories..."

          for d in arch drivers fs include init ipc kernel lib mm net scripts security; do
            if [ ! -d "$d" ]; then
              echo "::error::$d directory is missing"
              exit 1
            fi
          done

          if [ ! -f Makefile ]; then
            echo "::error::Kernel Makefile missing"
            exit 1
          fi

          echo "Kernel source looks valid."

      # ------------------------------------------------------------
      # Detect defconfig
      # ------------------------------------------------------------
      - name: Detect defconfig
        id: defconfig
        run: |
          set -e

          cd "$KERNEL_DIR"

          INPUT="${{ github.event.inputs.defconfig }}"

          if [ -n "$INPUT" ]; then
            echo "Using manually supplied defconfig: $INPUT"
            echo "name=$INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Searching for device-specific defconfig..."

          CANDIDATES="$(find arch/arm64/configs -type f \
            \( \
              -iname '*x6815*' \
              -o -iname '*x6815c*' \
              -o -iname '*mt6877*' \
              -o -iname '*dimensity*' \
            \) \
            -print | sed 's#^arch/arm64/configs/##' || true)"

          if [ -n "$CANDIDATES" ]; then
            echo "Possible device defconfigs:"
            echo "$CANDIDATES"

            COUNT="$(echo "$CANDIDATES" | grep -c .)"

            if [ "$COUNT" -eq 1 ]; then
              DEFCONFIG="$CANDIDATES"
            else
              echo "::error::More than one possible device defconfig found."
              echo "Set the workflow 'defconfig' input manually."
              exit 1
            fi
          else
            echo "::error::No X6815C/MT6877 defconfig was auto-detected."
            echo
            echo "Available arm64 defconfigs:"
            find arch/arm64/configs -type f \
              -maxdepth 3 \
              -print | sort
            exit 1
          fi

          echo "Selected defconfig: $DEFCONFIG"
          echo "name=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Add KernelSU v0.9.5
      # ------------------------------------------------------------
      - name: Integrate KernelSU
        if: github.event.inputs.kernelsu == 'true'
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "Installing KernelSU $KSU_VERSION..."

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/$KSU_VERSION/kernel/setup.sh" \
            | bash -s "$KSU_VERSION"

          echo
          echo "KernelSU integration complete."

          if [ ! -d KernelSU ]; then
            echo "::error::KernelSU directory was not created."
            exit 1
          fi

      # ------------------------------------------------------------
      # Generate original kernel config
      # ------------------------------------------------------------
      - name: Generate kernel config
        run: |
          set -e

          cd "$KERNEL_DIR"

          DEFCONFIG="${{ steps.defconfig.outputs.name }}"

          echo "Using:"
          echo "  ARCH=$ARCH"
          echo "  DEFCONFIG=$DEFCONFIG"

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O="$GITHUB_WORKSPACE/out" \
            "$DEFCONFIG"

      # ------------------------------------------------------------
      # Enable BPF + KernelSU configuration
      # ------------------------------------------------------------
      - name: Configure BPF and KernelSU
        run: |
          set -e

          cd "$KERNEL_DIR"

          CONFIG="$GITHUB_WORKSPACE/out/.config"

          echo "Config file:"
          echo "$CONFIG"

          # --------------------------------------------------------
          # BPF
          # --------------------------------------------------------

          ./scripts/config --file "$CONFIG" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT

          # These are optional/conditional on this kernel tree.
          # Only enable them when the symbol actually exists.
          if grep -q '^config BPF_EVENTS' init/Kconfig kernel/Kconfig 2>/dev/null || \
             grep -Rqs '^config BPF_EVENTS' kernel include; then
            ./scripts/config --file "$CONFIG" --enable BPF_EVENTS || true
          fi

          if grep -Rqs '^config CGROUP_BPF' .; then
            ./scripts/config --file "$CONFIG" --enable CGROUP_BPF || true
          fi

          # --------------------------------------------------------
          # KernelSU
          # --------------------------------------------------------

          if [ "${{ github.event.inputs.kernelsu }}" = "true" ]; then

            if grep -Rqs '^config KSU' KernelSU; then
              ./scripts/config --file "$CONFIG" --enable KSU
            fi

            # KernelSU v0.9.5 non-GKI integration uses kprobes.
            ./scripts/config --file "$CONFIG" \
              --enable KPROBES \
              --enable HAVE_KPROBES \
              --enable KPROBE_EVENTS || true

          fi

          # --------------------------------------------------------
          # Resolve dependencies
          # --------------------------------------------------------

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          echo
          echo "========== BPF CONFIG =========="

          grep -E \
            '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_BPF_EVENTS|CONFIG_CGROUP_BPF)=' \
            "$CONFIG" || true

          echo
          echo "========== KSU CONFIG =========="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            "$CONFIG" || true

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build kernel
        run: |
          set -e

          cd "$KERNEL_DIR"

          export ARCH=arm64
          export SUBARCH=arm64

          # LLVM is used for the cross compilation.
          export LLVM=1
          export LLVM_IAS=1

          echo "Starting kernel build..."

          make \
            -j"$(nproc --all)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            O="$GITHUB_WORKSPACE/out" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            modules

      # ------------------------------------------------------------
      # Verify output
      # ------------------------------------------------------------
      - name: Verify kernel output
        run: |
          set -e

          echo "========== Kernel output =========="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print | sort

          if [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "::error::Image.gz was not generated."
            exit 1
          fi

          echo
          echo "Image.gz successfully built."

      # ------------------------------------------------------------
      # Collect artifacts
      # ------------------------------------------------------------
      - name: Prepare artifacts
        run: |
          set -e

          mkdir -p artifacts

          # Kernel
          cp out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          # Config
          cp out/.config \
            artifacts/kernel.config

          # Kernel release
          if [ -f out/include/config/kernel.release ]; then
            cp out/include/config/kernel.release \
              artifacts/kernel.release
          fi

          # DTBs
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp {} artifacts/ \;
          fi

          # DTBO if generated
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp {} artifacts/ \;
          fi

          # Save build information
          {
            echo "Device: Infinix X6815C"
            echo "Architecture: arm64"
            echo "KernelSU: $KSU_VERSION"
            echo "BPF: enabled"
            echo "Build date: $(date -u)"
            echo "Kernel version:"
            cat artifacts/kernel.release 2>/dev/null || true
          } > artifacts/BUILD_INFO.txt

          echo
          echo "========== ARTIFACTS =========="

          ls -lah artifacts

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-KernelSU-BPF
          path: artifacts/
          if-no-files-found: error
