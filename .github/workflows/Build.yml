name: MT6877 (ruby) Kernel Build — BPF Patched
on:
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl wget zip unzip cpio

      - name: Clone Xiaomi MT6877 (ruby) Kernel Source
        run: |
          set -euo pipefail
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b ruby-s-oss kernel_src
          test -f kernel_src/Makefile
          echo "Kernel version:"
          grep -m3 -E "^(VERSION|PATCHLEVEL|SUBLEVEL)" kernel_src/Makefile

      - name: Download AOSP Toolchains (Clang r416183b + GCC 4.9)
        run: |
          set -euo pipefail
          mkdir -p toolchains
          cd toolchains

          echo "Downloading AOSP Clang r416183b..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          mkdir clang && tar -xf clang-r416183b.tar.gz -C clang
          test -x clang/bin/clang || { echo "ERROR: clang binary missing after extraction"; exit 1; }

          echo "Downloading AOSP GCC 4.9 (aarch64)..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/heads/android12-release.tar.gz -O gcc64.tar.gz
          mkdir gcc64 && tar -xf gcc64.tar.gz -C gcc64
          test -x gcc64/bin/aarch64-linux-android-gcc || { echo "ERROR: gcc64 binary missing after extraction"; exit 1; }

          echo "Downloading AOSP GCC 4.9 (arm32)..."
          wget -q https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/heads/android12-release.tar.gz -O gcc32.tar.gz
          mkdir gcc32 && tar -xf gcc32.tar.gz -C gcc32
          test -x gcc32/bin/arm-linux-androideabi-gcc || { echo "ERROR: gcc32 binary missing after extraction"; exit 1; }

      # IMPORTANT: ruby_user_defconfig alone is a device-specific FRAGMENT, not a
      # complete config — it has no binder/ashmem/netfilter/net_sched entries at
      # all. Those live in gki_defconfig. The real build needs all three layers
      # merged in this order: gki_defconfig (base) -> k6877v1_64_k419_defconfig
      # (MT6877 chip) -> ruby_user_defconfig (device). Picking just one file
      # (or auto-guessing with `find`, like the original script did) produces a
      # kernel that's missing core Android subsystems.
      - name: Build Config (merged) + BPF Patches
        run: |
          set -euo pipefail
          cd kernel_src
          export ARCH=arm64

          BASE=arch/arm64/configs/gki_defconfig
          CHIP=arch/arm64/configs/k6877v1_64_k419_defconfig
          DEVICE=arch/arm64/configs/ruby_user_defconfig
          for f in "$BASE" "$CHIP" "$DEVICE"; do
            test -f "$f" || { echo "ERROR: missing $f — branch layout changed, check arch/arm64/configs/"; exit 1; }
          done

          scripts/kconfig/merge_config.sh -m -O . "$BASE" "$CHIP" "$DEVICE"

          # BPF options below were checked one by one against this kernel's
          # actual Kconfig (4.19.191), not copy-pasted from a newer kernel's
          # build.yml. CONFIG_BPF_LSM and CONFIG_DEBUG_INFO_BTF are deliberately
          # left OUT — both require kernel 5.7+ and don't exist on 4.19, so
          # olddefconfig would've silently swallowed them anyway. Everything
          # kept below does exist and has its dependency chain satisfied by the
          # merge above (PERF_EVENTS is added explicitly since BPF_EVENTS needs
          # it and it wasn't on by default in this defconfig).
          cat << 'EOF' >> .config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_CGROUP_BPF=y
          CONFIG_PERF_EVENTS=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_BPF_EVENTS=y
          CONFIG_TRACEPOINTS=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF

          make olddefconfig

          echo "=== Applied BPF/related config — confirm nothing silently dropped ==="
          grep -E "^CONFIG_(BPF|KPROBE|NET_CLS|NET_ACT|NETFILTER_XT_MATCH_BPF|PERF_EVENTS)" .config

      - name: Compile Kernel
        run: |
          set -euo pipefail
          cd kernel_src

          CLANG_DIR="$(pwd)/../toolchains/clang/bin"
          GCC64_DIR="$(pwd)/../toolchains/gcc64/bin"
          GCC32_DIR="$(pwd)/../toolchains/gcc32/bin"
          export PATH="${CLANG_DIR}:${GCC64_DIR}:${GCC32_DIR}:${PATH}"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export HOSTCXX=clang++
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          set +e
          make -j"$(nproc --all)" Image.gz 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "Image.gz target failed (or doesn't exist for this config) — retrying with plain Image target..."
            make -j"$(nproc --all)" Image 2>&1 | tee -a ../build.log
          fi

      - name: Verify Output Binary
        run: |
          set -euo pipefail
          cd kernel_src
          mkdir -p ../workdir
          if [ -f "arch/arm64/boot/Image.gz" ]; then
            echo "SUCCESS: Image.gz compiled."
            cp arch/arm64/boot/Image.gz ../workdir/kernel
          elif [ -f "arch/arm64/boot/Image" ]; then
            echo "SUCCESS: Image compiled."
            cp arch/arm64/boot/Image ../workdir/kernel
          else
            echo "ERROR: no kernel image produced. See build.log artifact."
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Build AnyKernel3 Zip
        run: |
          set -euo pipefail
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3

          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## MT6877 (ruby) Kernel — BPF patched

          properties() { '
          kernel.string=MT6877 ruby Kernel (BPF)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/kernel anykernel3/Image.gz 2>/dev/null || cp workdir/kernel anykernel3/Image
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          zip -r9 "../MT6877-ruby-BPF-Kernel.zip" . -x ".git/*"

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: MT6877-ruby-BPF-Kernel
          path: MT6877-ruby-BPF-Kernel.zip
