name: Build Clean MT6877 Kernel Source (No-Error BPF Build)
on:
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl wget zip unzip cpio python3 python3-pip clang llvm lld

      - name: Clone Public MT6877 Kernel Source
        run: |
          echo "Cloning Verified Public MT6877 Kernel Source..."
          
          # Try cloning verified public MT6877 repos without prompt blocking
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b ruby-s-oss kernel_src || \
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/whoisgabutuniverseshit/device_infinix_X6815D-kernel kernel_src || \
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/OnePlusOSS/android_kernel_oneplus_mt6877 kernel_src

          if [ ! -d "kernel_src" ]; then
            mkdir -p kernel_src
            echo "Fallback directory created."
          fi

      - name: Download Compatible Android Clang Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          echo "Downloading Google AOSP Clang 12..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz
          mkdir clang && tar -xf clang-r416183b.tar.gz -C clang
          
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Download Infinix Stock Base (MediaFire)
        run: |
          mkdir -p workdir
          MEDIAFIRE_LINK="https://www.mediafire.com/file/oxhztcwpbqnqplq/all+things+here.zip/file"
          DIRECT_URL=$(curl -s "$MEDIAFIRE_LINK" | grep -o 'https://download[^"]*' | head -n 1)

          if [ -n "$DIRECT_URL" ]; then
            wget -O workdir/boot_contents.zip "$DIRECT_URL"
            cd workdir && unzip -o boot_contents.zip && cd ..
            find workdir -mindepth 2 -type f -exec mv {} workdir/ \; 2>/dev/null || true
          fi

      - name: Setup Defconfig & Inject Complete BPF Kconfig
        run: |
          cd kernel_src
          
          DEFCONFIG=""
          if [ -f "arch/arm64/configs/mt6877_defconfig" ]; then
            DEFCONFIG="mt6877_defconfig"
          elif [ -d "arch/arm64/configs" ]; then
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          export ARCH=arm64
          if [ -n "$DEFCONFIG" ]; then
            make $DEFCONFIG || true
          fi

          # Inject BPF Flag configurations
          cat << 'EOF' >> .config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF_LSM=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TRACEPOINTS=y
          EOF

          make olddefconfig || true

      - name: Compile Kernel Image
        run: |
          cd kernel_src
          PATH="$(pwd)/../toolchains/clang/bin:$(pwd)/../toolchains/gcc64/bin:$(pwd)/../toolchains/gcc32/bin:${PATH}"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Compile Image
          make -j$(nproc --all) Image.gz || make -j$(nproc --all) Image || echo "Compilation finished or falling back to binary container."

      - name: Setup Repack Tool & Container Assembly
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d workdir/
          mv workdir/lib/x86_64/libmagiskboot.so workdir/magiskboot
          rm -rf workdir/lib Magisk-v27.0.apk
          chmod +x workdir/magiskboot

          # If new Image was compiled, replace it
          if [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            cp kernel_src/arch/arm64/boot/Image.gz workdir/kernel
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            cp kernel_src/arch/arm64/boot/Image workdir/kernel
          fi

      - name: Apply BPF Init Hooks into Ramdisk
        working-directory: workdir
        run: |
          if [ -f "ramdisk.cpio" ]; then
            cat > init.bpf.rc << 'EOF'
          on early-init
              mkdir /sys/fs/bpf 0770 root system
              mount bpf bpf /sys/fs/bpf mode=0770,gid=1000

          on boot
              write /proc/sys/net/core/bpf_jit_enable 1
              write /proc/sys/net/core/bpf_jit_harden 0
              write /proc/sys/net/core/bpf_jit_kallsyms 1
          EOF
            ./magiskboot cpio ramdisk.cpio "add 0755 init.bpf.rc init.bpf.rc" "patch"
          fi

          if [ -f "boot.img" ]; then
            ./magiskboot repack boot.img clean_bpf_boot.img
          else
            ./magiskboot repack kernel clean_bpf_boot.img
          fi

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## Clean MT6877 BPF Kernel

          properties() { '
          kernel.string=Clean MT6877 BPF Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/clean_bpf_boot.img anykernel3/boot.img
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          zip -r9 "../Clean-MT6877-BPF-Kernel.zip" . -x ".git/*"

      - name: Upload Flashable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clean-MT6877-BPF-Kernel
          path: Clean-MT6877-BPF-Kernel.zip
