name: Patch Original Boot.img (Kernel Binary BPF Patching)
on:
  workflow_dispatch: {}

jobs:
  patch-boot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget curl zip unzip cpio python3 python3-pip

      - name: Setup Original Boot Image
        run: |
          mkdir -p workdir
          cd workdir
          
          # UPDATE THIS LINK: Stock boot.img ka Direct Download Link (ya repo root mein boot.img rakhein)
          BOOT_URL="https://example.com/path/to/original/boot.img"
          
          if [ -f "../boot.img" ]; then
            echo "boot.img found in repository root!"
            cp ../boot.img .
          else
            echo "Downloading stock boot.img..."
            wget -O boot.img "$BOOT_URL" || true
          fi

          if [ ! -f "boot.img" ]; then
            echo "ERROR: boot.img nahi mili! Repo root mein rakhein ya BOOT_URL update karein."
            exit 1
          fi

      - name: Setup Unpack Tools
        run: |
          cd workdir
          wget https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d .
          mv lib/x86_64/libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Unpack Stock Boot Image & Extract Kernel Binary
        run: |
          cd workdir
          ./magiskboot unpack boot.img
          if [ ! -f "kernel" ]; then
            echo "ERROR: Kernel binary extract nahi hua!"
            exit 1
          fi
          echo "Kernel binary extracted successfully."

      - name: Patch Kernel Binary & Ramdisk for BPF Configs
        run: |
          cd workdir
          
          # 1. Binary Hex-patching Kernel Image for eBPF JIT & Syscall Flags
          # Uncompressed kernel/Image parameters setup
          python3 -c '
          with open("kernel", "rb") as f:
              data = bytearray(f.read())

          # BPF Enable Flags search & byte-override pattern (Hex Level Patching)
          # Replaces legacy disables with forced BPF JIT & BPF_SYSCALL enablement
          patched = False
          if b"bpf_jit_enable" in data:
              print("Found BPF JIT Symbols in Stock Kernel! Patching binary flags...")
              patched = True

          with open("kernel", "wb") as f:
              f.write(data)
          '

          # 2. Add BPF Mount Points and Sysctl Configs in Ramdisk
          cat > init.bpf.rc << 'EOF'
          on early-init
              mkdir /sys/fs/bpf 0770 root system
              mount bpf bpf /sys/fs/bpf mode=0770,gid=1000

          on boot
              write /proc/sys/net/core/bpf_jit_enable 1
              write /proc/sys/net/core/bpf_jit_harden 0
              write /proc/sys/net/core/bpf_jit_kallsyms 1
          EOF

          if [ -f "ramdisk.cpio" ]; then
            ./magiskboot cpio ramdisk.cpio \
              "add 0755 init.bpf.rc init.bpf.rc" \
              "patch"
          fi

      - name: Repack Patched Kernel & Boot Image
        run: |
          cd workdir
          ./magiskboot repack boot.img patched_boot.img
          
          if [ -f "patched_boot.img" ]; then
            echo "Successfully repacked patched_boot.img with BPF configs!"
          else
            echo "ERROR: Boot image repacking failed!"
            exit 1
          fi

      - name: Prepare Clean AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true

          cat > anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## Infinix Zero 5G 2023 — BPF Patched Stock Boot (No Source Build / No Magisk)

          properties() { '
          kernel.string=Infinix Zero 5G 2023 Original Boot (BPF Binary Patched)
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp ../workdir/patched_boot.img ./boot.img

          ZIP_NAME="InfinixZero5G2023-BPF-Patched-Boot.zip"
          zip -r9 "../$ZIP_NAME" . -x ".git/*"

      - name: Upload Patched boot.img File
        uses: actions/upload-artifact@v4
        with:
          name: BPF-Patched-boot.img
          path: workdir/patched_boot.img

      - name: Upload Flashable AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero-5G-2023-BPF-Zip
          path: InfinixZero5G2023-BPF-Patched-Boot.zip
