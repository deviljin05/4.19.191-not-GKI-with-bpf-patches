name: Build Clean MT6877 Kernel (LLVM/Clang Engine)
on:
  workflow_dispatch: {}

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make bc bison flex libssl-dev libelf-dev libncurses5-dev \
            git curl wget zip unzip cpio python3 python3-pip clang llvm lld

      - name: Clone Verified MT6877 Kernel Source
        run: |
          echo "Cloning Verified Public MT6877 Kernel Source..."
          GIT_TERMINAL_PROMPT=0 git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b ruby-s-oss kernel_src

          if [ ! -d "kernel_src" ]; then
            echo "ERROR: Failed to clone kernel source repository."
            exit 1
          fi

      - name: Download Google AOSP Clang Toolchain
        run: |
          mkdir -p toolchains
          cd toolchains
          
          # Download Standalone AOSP Clang 13 (Built-in LLVM Utilities)
          echo "Downloading Google AOSP Clang..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz
          mkdir clang && tar -xf clang-r450784d.tar.gz -C clang
          
          # Cross-Compile Binaries
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Download Infinix Stock Base (MediaFire)
        run: |
          mkdir -p workdir
          MEDIAFIRE_LINK="https://www.mediafire.com/file/oxhztcwpbqnqplq/all+things+here.zip/file"
          DIRECT_URL=$(curl -s "$MEDIAFIRE_LINK" | grep -o 'https://download[^"]*' | head -n 1)

          if [ -n "$DIRECT_URL" ]; then
            wget -O workdir/boot_contents.zip "$DIRECT_URL"
            cd workdir && unzip -o boot_contents.zip && cd ..
            find workdir -mindepth 2 -type f -exec mv {} workdir/ \; 2>/dev/null || true
          fi

      - name: Setup Defconfig & Inject BPF Kconfig
        run: |
          cd kernel_src
          
          DEFCONFIG=""
          if [ -f "arch/arm64/configs/ruby_defconfig" ]; then
            DEFCONFIG="ruby_defconfig"
          elif [ -f "arch/arm64/configs/mt6877_defconfig" ]; then
            DEFCONFIG="mt6877_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -name "*defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
          fi

          export ARCH=arm64
          make $DEFCONFIG

          # Inject Clean BPF Flags
          cat << 'EOF' >> .config
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          CONFIG_BPF_LSM=y
          CONFIG_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_TRACEPOINTS=y
          EOF

          make olddefconfig

      - name: Compile C/C++ Kernel Image (LLVM/Clang Strict Mode)
        run: |
          cd kernel_src
          
          CLANG_DIR="$(pwd)/../toolchains/clang/bin"
          GCC64_DIR="$(pwd)/../toolchains/gcc64/bin"
          GCC32_DIR="$(pwd)/../toolchains/gcc32/bin"
          
          export PATH="${CLANG_DIR}:${GCC64_DIR}:${GCC32_DIR}:${PATH}"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1
          export LLVM_IAS=1

          echo "Starting C/C++ Kernel Source Compile with LLVM/Clang..."
          make -j$(nproc --all) Image.gz || make -j$(nproc --all) Image

      - name: Verify Strict Output (Build Guard)
        run: |
          if [ -f "kernel_src/arch/arm64/boot/Image.gz" ]; then
            echo "SUCCESS: Fresh compiled Image.gz generated!"
            cp kernel_src/arch/arm64/boot/Image.gz workdir/kernel
          elif [ -f "kernel_src/arch/arm64/boot/Image" ]; then
            echo "SUCCESS: Fresh compiled Image generated!"
            cp kernel_src/arch/arm64/boot/Image workdir/kernel
          else
            echo "ERROR: Kernel compilation failed. No Image generated."
            exit 1
          fi

      - name: Repack Boot & Apply BPF Hooks
        working-directory: workdir
        run: |
          wget -q https://github.com/topjohnwu/Magisk/releases/download/v27.0/Magisk-v27.0.apk
          unzip -q Magisk-v27.0.apk "lib/x86_64/libmagiskboot.so" -d ./
          mv lib/x86_64/libmagiskboot.so ./magiskboot
          rm -rf lib Magisk-v27.0.apk
          chmod +x magiskboot

          if [ -f "ramdisk.cpio" ]; then
            cat > init.bpf.rc << 'EOF'
          on early-init
              mkdir /sys/fs/bpf 0770 root system
              mount bpf bpf /sys/fs/bpf mode=0770,gid=1000

          on boot
              write /proc/sys/net/core/bpf_jit_enable 1
              write /proc/sys/net/core/bpf_jit_harden 0
              write /proc/sys/net/core/bpf_jit_kallsyms 1
          EOF
            ./magiskboot cpio ramdisk.cpio "add 0755 init.bpf.rc init.bpf.rc" "patch"
          fi

          if [ -f "boot.img" ]; then
            ./magiskboot repack boot.img compiled_bpf_boot.img
          else
            ./magiskboot repack kernel compiled_bpf_boot.img
          fi

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 anykernel3
          
          cat > anykernel3/anykernel.sh <<'EOF'
          ### AnyKernel3 Mod Script
          ## MT6877 BPF Clang Compiled Kernel

          properties() { '
          kernel.string=MT6877 BPF Clang Compiled Kernel
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          block=auto
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          '; }

          [ -f /tmp/anykernel/tools/ak3-core.sh ] && . /tmp/anykernel/tools/ak3-core.sh || . tools/ak3-core.sh

          dump_boot;
          write_boot;
          EOF

          cp workdir/compiled_bpf_boot.img anykernel3/boot.img
          cd anykernel3
          rm -rf .git README.md LICENSE .github 2>/dev/null || true
          zip -r9 "../MT6877-BPF-Kernel-Clang.zip" . -x ".git/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT6877-BPF-Kernel-Clang
          path: MT6877-BPF-Kernel-Clang.zip
