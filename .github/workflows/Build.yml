name: Build X6815C Kernel (Smart AutoHeal)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch (empty = repo default)"
        required: false
        default: "main"
      defconfig:
        description: "Defconfig name (auto = detect)"
        required: true
        default: "auto"
      enable_bpf:
        description: "Enable BPF configs + apply patches"
        type: boolean
        default: true
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 rsync unzip zip xz-utils \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zstd

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi

      # 🚀 AUTO-HEAL: Scans and fixes broken vendor leftovers
      - name: Auto-Fix Source Tree
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "🔍 SCANNING SOURCE FOR BROKEN ENTRIES..."
          echo "=========================================="
          
          # 1. Check for missing KernelSU Folder
          if [ ! -d "drivers/kernelsu" ]; then
            echo "❌ drivers/kernelsu folder missing. Searching for leftover references..."
            
            # Clean Kconfig
            if grep -q "drivers/kernelsu" drivers/Kconfig; then
              echo "   -> Found leftover in drivers/Kconfig. Removing..."
              sed -i '/drivers\/kernelsu/d' drivers/Kconfig
            fi
            
            # Clean Makefile
            if grep -q "kernelsu" drivers/Makefile; then
              echo "   -> Found leftover in drivers/Makefile. Removing..."
              sed -i '/kernelsu/d' drivers/Makefile
            fi
          else
            echo "✅ drivers/kernelsu exists."
          fi

          # 2. Verify Defconfig exists, if not, find closest match
          DEFCONFIG_FILE=$(find arch/arm64/configs -maxdepth 1 -name '*X6815C*' -o -name '*6877*' | head -n 1)
          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "⚠️ Exact X6815C defconfig not found. Picking first available..."
            DEFCONFIG_FILE=$(find arch/arm64/configs -maxdepth 1 -name '*defconfig' | head -n 1)
          fi
          
          if [ -z "$DEFCONFIG_FILE" ]; then
            echo "::error::❌ CRITICAL: No defconfigs found in arch/arm64/configs"
            exit 1
          fi
          
          DC_NAME=$(basename "$DEFCONFIG_FILE")
          echo "✅ Using Defconfig: $DC_NAME"
          echo "DEFCONFIG=$DC_NAME" >> "$GITHUB_ENV"

      - name: Set up toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Apply BPF patches
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          shopt -s nullglob
          PATCHES=("$GITHUB_WORKSPACE"/patches/bpf/*.patch)
          for p in "${PATCHES[@]}"; do
            echo ">> Applying $(basename "$p")"
            git apply "$p" || echo "::warning::Patch failed: $p (skipping)"
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          BPF: ${{ inputs.enable_bpf }}
        run: |
          : > ci.config
          
          # Auto-injected Critical Configs
          cat >> ci.config <<'EOF'
          CONFIG_MODULE_SIG=n
          CONFIG_SYSTEM_TRUSTED_KEYS=""
          CONFIG_DEBUG_INFO=n
          CONFIG_LTO_NONE=y
          CONFIG_WERROR=n
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          CONFIG_MTK_COMBO_WIFI_HIF=sdio
          EOF

          if [ "$BPF" = "true" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF
          fi
          
          sed -i 's/^ *//' ci.config

          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config ci.config
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"
          
          # SMART BUILD: If WLAN complains, env vars force it.
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            WIFI_HIF=sdio \
            MTK_COMBO_CHIP=MT6632 \
            2>&1 | tee build.log

      - name: Verify & Collect Outputs
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          
          # Auto-Detect Image.gz-dtb or fallback
          if [ -f "$B/Image.gz-dtb" ]; then
            echo "✅ Image.gz-dtb found."
            cp "$B/Image.gz-dtb" "$GITHUB_WORKSPACE/dist/"
          elif [ -f "$B/Image.gz" ]; then
            echo "⚠️ Image.gz found."
            cp "$B/Image.gz" "$GITHUB_WORKSPACE/dist/"
          else
            echo "::error::❌ No Kernel Image produced."
            exit 1
          fi
          
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          D="$GITHUB_WORKSPACE/dist"
          
          if [ -f "$D/Image.gz-dtb" ]; then
            cp "$D/Image.gz-dtb" ak3/
          else
            cp "$D/Image.gz" ak3/
            if ls "$D"/*.dtb >/dev/null 2>&1; then
              cat "$D"/*.dtb > ak3/dtb
            fi
          fi
          
          sed -i -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER}|" -e "s|^do.devicecheck=.*|do.devicecheck=0|" ak3/anykernel.sh
          
          ZIP="X6815C-${KVER}-BPF.zip"
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*.git*')

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-kernel-build
          path: dist/*

      - name: Upload Log (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
