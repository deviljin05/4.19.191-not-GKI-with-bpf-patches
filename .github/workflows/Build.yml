name: X6815C 4.19 Kernel - BPF + KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # Checkout build repository
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # Checkout actual X6815C kernel source
      # ============================================================
      - name: Checkout X6815C kernel source
        run: |
          set -eux

          rm -rf kernel-source

          git clone --depth=1 \
            https://github.com/rag12ghu-design/android_device_infinix_X6815C-kernel.git \
            kernel-source

      # ============================================================
      # Install dependencies
      # ============================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # Locate kernel source
      # ============================================================
      - name: Locate kernel source
        id: kernel
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Repository structure"
          echo "=========================================="

          find kernel-source \
            -maxdepth 2 \
            -type d \
            -print | sort

          echo
          echo "=========================================="
          echo "Locating kernel-headers"
          echo "=========================================="

          KERNEL_DIR=""

          # Expected location.
          if [ -d "kernel-source/kernel-headers" ]; then
            KERNEL_DIR="kernel-source/kernel-headers"
          fi

          # Fallback.
          if [ -z "$KERNEL_DIR" ]; then
            KERNEL_DIR="$(
              find kernel-source \
                -type d \
                -name kernel-headers \
                -print \
                -quit
            )"
          fi

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::kernel-headers directory was not found."
            exit 1
          fi

          echo "Kernel directory:"
          echo "$KERNEL_DIR"

          echo
          echo "=========================================="
          echo "Validating kernel source"
          echo "=========================================="

          REQUIRED_ITEMS="
          Makefile
          arch
          block
          crypto
          drivers
          fs
          include
          init
          ipc
          kernel
          lib
          mm
          net
          scripts
          security
          "

          for item in $REQUIRED_ITEMS; do
            if [ ! -e "$KERNEL_DIR/$item" ]; then
              echo "::error::Missing kernel item: $item"
              exit 1
            fi
          done

          echo "Kernel source validation successful."

          echo
          echo "Ignoring:"
          echo "  vendor-modules/"
          echo "  prebuilt .ko files"
          echo "  existing Image.gz"
          echo "  existing dtbo.img"

          echo
          echo "kernel_dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Kernel version
      # ============================================================
      - name: Check kernel version
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # Find ARM64 defconfig
      # ============================================================
      - name: Find defconfig
        id: config
        shell: bash
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          CONFIG_DIR="arch/arm64/configs"

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::arch/arm64/configs missing."
            exit 1
          fi

          echo "Candidate device configs:"
          echo

          find "$CONFIG_DIR" \
            -type f \
            \( \
              -iname '*x6815*' \
              -o -iname '*mt6877*' \
              -o -iname '*dimensity*' \
              -o -iname '*1080*' \
            \) \
            -print | sort

          MATCHES="$(
            find "$CONFIG_DIR" \
              -type f \
              \( \
                -iname '*x6815*' \
                -o -iname '*mt6877*' \
                -o -iname '*dimensity*' \
                -o -iname '*1080*' \
              \) \
              -print
          "

          if [ -z "$MATCHES" ]; then
            echo "::error::No X6815C/MT6877 defconfig found."

            echo
            echo "All available configs:"
            find "$CONFIG_DIR" \
              -type f \
              -maxdepth 3 \
              -print | sort

            exit 1
          fi

          COUNT=$(printf '%s\n' "$MATCHES" | grep -c .)

          if [ "$COUNT" -gt 1 ]; then
            echo "::error::Multiple possible defconfigs found:"
            echo "$MATCHES"
            exit 1
          fi

          DEFCONFIG="$(basename "$MATCHES")"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Prepare output
      # ============================================================
      - name: Prepare output
        run: |
          set -e

          rm -rf out artifacts

          mkdir -p out
          mkdir -p artifacts

      # ============================================================
      # Generate original config
      # ============================================================
      - name: Generate kernel configuration
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          DEFCONFIG="${{ steps.config.outputs.defconfig }}"

          cd "$KERNEL_DIR"

          echo "Building config:"
          echo "$DEFCONFIG"

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            "$DEFCONFIG"

          test -f "$GITHUB_WORKSPACE/out/.config"

      # ============================================================
      # KernelSU v0.9.5
      # ============================================================
      - name: Integrate KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Installing KernelSU v0.9.5..."

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh \
            | bash

          if [ ! -d KernelSU ]; then
            echo "::error::KernelSU integration failed."
            exit 1
          fi

          echo "KernelSU installed."

      # ============================================================
      # Configure BPF + KernelSU
      # ============================================================
      - name: Configure BPF and KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Enabling BPF"
          echo "=========================================="

          ./scripts/config \
            --file "$CONFIG" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT

          # Optional BPF events.
          if grep -Rqs '^config BPF_EVENTS' \
              kernel \
              include \
              drivers; then

            ./scripts/config \
              --file "$CONFIG" \
              --enable BPF_EVENTS || true
          fi

          # Optional cgroup BPF.
          if grep -Rqs '^config CGROUP_BPF' .; then
            ./scripts/config \
              --file "$CONFIG" \
              --enable CGROUP_BPF || true
          fi

          echo
          echo "=========================================="
          echo "Enabling KernelSU"
          echo "=========================================="

          if grep -Rqs '^config KSU' KernelSU; then
            ./scripts/config \
              --file "$CONFIG" \
              --enable KSU
          fi

          # Non-GKI KernelSU dependencies.
          ./scripts/config \
            --file "$CONFIG" \
            --enable KPROBES || true

          ./scripts/config \
            --file "$CONFIG" \
            --enable KPROBE_EVENTS || true

          echo
          echo "Resolving configuration..."

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          echo
          echo "=========================================="
          echo "BPF CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_BPF_EVENTS|CONFIG_CGROUP_BPF)=' \
            "$CONFIG" || true

          echo
          echo "=========================================="
          echo "KERNELSU CONFIG"
          echo "=========================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            "$CONFIG" || true

      # ============================================================
      # Build kernel
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "Building X6815C kernel"
          echo "=========================================="

          make \
            -j"$(nproc --all)" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            modules

      # ============================================================
      # Verify
      # ============================================================
      - name: Verify build
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image.gz was not generated."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "BUILD SUCCESS"
          echo "=========================================="

          ls -lh "$IMAGE"

      # ============================================================
      # Collect artifacts
      # ============================================================
      - name: Collect artifacts
        run: |
          set -e

          mkdir -p artifacts

          # Kernel image.
          cp \
            out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          # Final config.
          cp \
            out/.config \
            artifacts/kernel.config

          # Kernel release.
          if [ -f out/include/config/kernel.release ]; then
            cp \
              out/include/config/kernel.release \
              artifacts/kernel.release
          fi

          # DTBs.
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp {} artifacts/ \;
          fi

          # DTBOs generated by build, if any.
          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp {} artifacts/ \;
          fi

          # Preserve original vendor modules.
          if [ -d kernel-source/vendor-modules ]; then
            mkdir -p artifacts/vendor-modules

            cp \
              kernel-source/vendor-modules/*.ko \
              artifacts/vendor-modules/ \
              2>/dev/null || true
          fi

          # Build information.
          {
            echo "Device: Infinix X6815C"
            echo "Architecture: ARM64"
            echo "KernelSU: v0.9.5"
            echo "BPF: enabled"
            echo "Build date: $(date -u)"
            echo "Kernel release: $(cat out/include/config/kernel.release 2>/dev/null || echo unknown)"
          } > artifacts/BUILD_INFO.txt

          echo
          echo "=========================================="
          echo "ARTIFACTS"
          echo "=========================================="

          find artifacts \
            -type f \
            -exec ls -lh {} \;

      # ============================================================
      # Upload
      # ============================================================
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-4.19-KernelSU-BPF
          path: artifacts/
          if-no-files-found: error
