name: X6815C 4.19 Kernel - BPF + KernelSU

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ============================================================
      # 1. Checkout the repository containing this workflow
      # ============================================================
      - name: Checkout build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. Clone actual kernel source
      #
      # IMPORTANT:
      # The build repository does NOT contain the kernel source.
      # We clone the source repository separately.
      # ============================================================
      - name: Checkout X6815C kernel source
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/rag12ghu-design/android_device_infinix_X6815C-kernel.git \
            kernel-source

      # ============================================================
      # 3. Locate the real kernel root
      # ============================================================
      - name: Locate kernel source
        id: kernel
        shell: bash
        run: |
          set -e

          echo "========== SOURCE REPOSITORY =========="
          find kernel-source -maxdepth 3 -type d | sort

          echo
          echo "========== SEARCHING FOR KERNEL TREE =========="

          KERNEL_DIR=""

          # Search for kernel-headers first.
          while IFS= read -r dir; do
            if [ -f "$dir/Makefile" ] && \
               [ -d "$dir/arch" ] && \
               [ -d "$dir/drivers" ] && \
               [ -d "$dir/include" ] && \
               [ -d "$dir/kernel" ] && \
               [ -d "$dir/mm" ] && \
               [ -d "$dir/net" ]; then
              KERNEL_DIR="$dir"
              break
            fi
          done < <(find kernel-source -type d -name "kernel-headers" -print)

          # Fallback: search every directory.
          if [ -z "$KERNEL_DIR" ]; then
            while IFS= read -r dir; do
              if [ -f "$dir/Makefile" ] && \
                 [ -d "$dir/arch" ] && \
                 [ -d "$dir/drivers" ] && \
                 [ -d "$dir/include" ] && \
                 [ -d "$dir/kernel" ] && \
                 [ -d "$dir/mm" ] && \
                 [ -d "$dir/net" ]; then
                KERNEL_DIR="$dir"
                break
              fi
            done < <(find kernel-source -type d -print)
          fi

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::No complete kernel source tree was found."
            echo
            echo "Files in repository:"
            find kernel-source -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "========================================"
          echo "Kernel source found:"
          echo "$KERNEL_DIR"
          echo "========================================"

          echo "kernel_dir=$KERNEL_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 4. Install build dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            libncurses5-dev \
            libncurses-dev \
            lld \
            llvm \
            python3 \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip

      # ============================================================
      # 5. Verify source
      # ============================================================
      - name: Verify kernel source
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Kernel root:"
          pwd

          echo
          echo "Kernel version:"
          make kernelversion || true

          echo
          echo "Checking kernel directories..."

          for d in \
            arch \
            block \
            crypto \
            drivers \
            fs \
            include \
            init \
            ipc \
            kernel \
            lib \
            mm \
            net \
            scripts \
            security
          do
            if [ ! -d "$d" ]; then
              echo "::error::Missing directory: $d"
              exit 1
            fi
          done

          test -f Makefile

          echo
          echo "Kernel source verification PASSED."

      # ============================================================
      # 6. Find ARM64 defconfig
      # ============================================================
      - name: Find device defconfig
        id: config
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          CONFIG_DIR="arch/arm64/configs"

          if [ ! -d "$CONFIG_DIR" ]; then
            echo "::error::ARM64 config directory missing."
            exit 1
          fi

          echo "Available candidate configs:"

          find "$CONFIG_DIR" \
            -type f \
            \( \
              -iname '*x6815*' \
              -o -iname '*mt6877*' \
              -o -iname '*1080*' \
              -o -iname '*dimensity*' \
            \) \
            -print | sort

          MATCHES="$(
            find "$CONFIG_DIR" \
              -type f \
              \( \
                -iname '*x6815*' \
                -o -iname '*mt6877*' \
                -o -iname '*1080*' \
                -o -iname '*dimensity*' \
              \) \
              -print
          "

          if [ -z "$MATCHES" ]; then
            echo "::error::No device-specific defconfig found."
            echo
            echo "All available defconfigs:"
            find "$CONFIG_DIR" -type f -maxdepth 3 -print | sort
            exit 1
          fi

          COUNT=$(printf '%s\n' "$MATCHES" | grep -c .)

          if [ "$COUNT" -ne 1 ]; then
            echo "::error::Multiple possible defconfigs found:"
            echo "$MATCHES"
            echo
            echo "Automatic selection stopped."
            exit 1
          fi

          DEFCONFIG="$(basename "$MATCHES")"

          echo
          echo "Selected defconfig:"
          echo "$DEFCONFIG"

          echo "defconfig=$DEFCONFIG" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. Prepare output
      # ============================================================
      - name: Prepare output
        run: |
          set -e
          rm -rf out artifacts
          mkdir -p out artifacts

      # ============================================================
      # 8. Generate original configuration
      # ============================================================
      - name: Generate kernel config
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          DEFCONFIG="${{ steps.config.outputs.defconfig }}"

          cd "$KERNEL_DIR"

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            "$DEFCONFIG"

          test -f "$GITHUB_WORKSPACE/out/.config"

      # ============================================================
      # 9. Install KernelSU
      #
      # v0.9.5 is used for this old/non-GKI style kernel.
      # ============================================================
      - name: Integrate KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "Installing KernelSU v0.9.5..."

          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh" \
            | bash

          if [ ! -d KernelSU ]; then
            echo "::error::KernelSU integration failed."
            exit 1
          fi

          echo "KernelSU integration successful."

      # ============================================================
      # 10. Enable BPF + KernelSU config
      # ============================================================
      - name: Configure BPF and KernelSU
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"
          CONFIG="$GITHUB_WORKSPACE/out/.config"

          cd "$KERNEL_DIR"

          echo "Enabling BPF..."

          ./scripts/config --file "$CONFIG" \
            --enable BPF \
            --enable BPF_SYSCALL \
            --enable BPF_JIT

          # Optional BPF features, only when supported by this tree.

          if grep -Rqs '^config BPF_EVENTS' \
              kernel include drivers; then
            ./scripts/config --file "$CONFIG" \
              --enable BPF_EVENTS || true
          fi

          if grep -Rqs '^config CGROUP_BPF' .; then
            ./scripts/config --file "$CONFIG" \
              --enable CGROUP_BPF || true
          fi

          echo
          echo "Enabling KernelSU..."

          if grep -Rqs '^config KSU' KernelSU; then
            ./scripts/config --file "$CONFIG" \
              --enable KSU
          fi

          ./scripts/config --file "$CONFIG" \
            --enable KPROBES || true

          ./scripts/config --file "$CONFIG" \
            --enable KPROBE_EVENTS || true

          echo
          echo "Resolving configuration..."

          make \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            olddefconfig

          echo
          echo "========== FINAL BPF CONFIG =========="

          grep -E \
            '^(CONFIG_BPF|CONFIG_BPF_SYSCALL|CONFIG_BPF_JIT|CONFIG_BPF_EVENTS|CONFIG_CGROUP_BPF)=' \
            "$CONFIG" || true

          echo
          echo "========== FINAL KSU CONFIG =========="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS)=' \
            "$CONFIG" || true

      # ============================================================
      # 11. Build kernel
      # ============================================================
      - name: Build kernel
        run: |
          set -e

          KERNEL_DIR="${{ steps.kernel.outputs.kernel_dir }}"

          cd "$KERNEL_DIR"

          echo "========================================"
          echo "Starting ARM64 kernel build"
          echo "========================================"

          make \
            -j"$(nproc --all)" \
            ARCH=arm64 \
            SUBARCH=arm64 \
            O="$GITHUB_WORKSPACE/out" \
            LLVM=1 \
            LLVM_IAS=1 \
            Image.gz \
            dtbs \
            modules

      # ============================================================
      # 12. Verify Image
      # ============================================================
      - name: Verify kernel
        run: |
          set -e

          IMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image.gz was not generated."
            exit 1
          fi

          echo
          echo "Kernel built successfully:"
          ls -lh "$IMAGE"

      # ============================================================
      # 13. Collect DTBs
      # ============================================================
      - name: Collect kernel artifacts
        run: |
          set -e

          mkdir -p artifacts

          cp \
            out/arch/arm64/boot/Image.gz \
            artifacts/Image.gz

          cp \
            out/.config \
            artifacts/kernel.config

          if [ -f out/include/config/kernel.release ]; then
            cp \
              out/include/config/kernel.release \
              artifacts/kernel.release
          fi

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtb' \
              -exec cp {} artifacts/ \;
          fi

          if [ -d out/arch/arm64/boot/dts ]; then
            find out/arch/arm64/boot/dts \
              -type f \
              -name '*.dtbo' \
              -exec cp {} artifacts/ \;
          fi

          cat > artifacts/BUILD_INFO.txt <<EOF
          Device: Infinix X6815C
          Architecture: ARM64
          KernelSU: v0.9.5
          BPF: enabled
          Build date: $(date -u)
          Kernel release: $(cat out/include/config/kernel.release 2>/dev/null || echo unknown)
          EOF

          echo
          echo "========== ARTIFACTS =========="
          ls -lah artifacts

      # ============================================================
      # 14. Upload
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-4.19-KernelSU-BPF
          path: artifacts/
          if-no-files-found: error
