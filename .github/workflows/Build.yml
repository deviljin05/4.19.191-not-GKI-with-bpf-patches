name: Build Infinix Zero 5G 2023 Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig_override:
        description: "Exact defconfig filename (leave blank to auto-detect)"
        required: false
        default: ""

env:
  TZ: Asia/Karachi
  KERNEL_REPO: "xiaomi-mediatek-devs/android_kernel_xiaomi_mt6877"
  KERNEL_BRANCH: "lineage-21"
  ANYKERNEL_REPO: "osm0sis/AnyKernel3"
  ANYKERNEL_BRANCH: "master"
  CLANG_VERSION: "r487747c"
  CLANG_TAG: "android-14.0.0_r1"

jobs:
  kernel-compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          set -e
          # lib32z1-dev / lib32ncurses5-dev are :i386 packages — apt can't find
          # them on ubuntu-22.04 runners until the i386 architecture is enabled.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev bzip2 libssl-dev \
            flex bison libelf-dev clang lld git zip unzip ccache kmod \
            lib32z1-dev lib32ncurses5-dev \
            crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Clone Kernel Source
        run: |
          set -e
          git clone --depth=1 --recurse-submodules --shallow-submodules \
            -b "${{ env.KERNEL_BRANCH }}" "https://github.com/${{ env.KERNEL_REPO }}.git" "$GITHUB_WORKSPACE/source"

          # Surface any submodule that failed to fetch instead of discovering it
          # mid-compile as a missing Makefile.
          cd "$GITHUB_WORKSPACE/source"
          if [ -f .gitmodules ]; then
            echo "Submodules declared in this tree:"
            git config --file .gitmodules --get-regexp path | awk '{print $2}'
            git submodule status | tee /tmp/submodule-status.txt
            if grep -q '^-' /tmp/submodule-status.txt; then
              echo "::error:: One or more submodules failed to initialize (see '-' entries above)."
              echo "::error:: These are likely vendor driver blobs not present at the pinned commit."
              exit 1
            fi
          else
            echo "No .gitmodules found — if drivers still reference missing paths later,"
            echo "those directories are absent from this tree entirely (not a submodule issue)."
          fi

      - name: Prune Dangling Driver Kbuild References
        run: |
          cd "$GITHUB_WORKSPACE/source"
          python3 - << 'PYEOF'
          import re, os

          pattern = re.compile(r'^(\s*obj-\$\(CONFIG_[A-Za-z0-9_]+\)\s*\+=\s*)([A-Za-z0-9_\-]+)/(\s*)$')
          pruned = 0

          for root, dirs, files in os.walk('.'):
              if '.git' in root.split(os.sep):
                  continue
              for fname in files:
                  if fname not in ('Makefile', 'Kbuild'):
                      continue
                  fpath = os.path.join(root, fname)
                  try:
                      with open(fpath, 'r', errors='ignore') as f:
                          lines = f.readlines()
                  except OSError:
                      continue

                  changed = False
                  for i, line in enumerate(lines):
                      m = pattern.match(line.rstrip('\n'))
                      if not m:
                          continue
                      subdir = m.group(2)
                      target = os.path.join(root, subdir)
                      has_build_file = os.path.isfile(os.path.join(target, 'Makefile')) or os.path.isfile(os.path.join(target, 'Kbuild'))
                      if not os.path.isdir(target) or not has_build_file:
                          print(f"Pruning dangling reference in {fpath}: {subdir}/ (missing build file)")
                          lines[i] = f"# PRUNED (missing dir/Makefile): {line}"
                          changed = True
                          pruned += 1

                  if changed:
                      with open(fpath, 'w') as f:
                          f.writelines(lines)

          print(f"Pruned {pruned} dangling Kbuild reference(s).")
          PYEOF

      - name: Download AOSP Clang Toolchain
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"

          # Pull official stable Google prebuilt Android Clang components.
          # NOTE: we no longer download Google's prebuilt GCC repos for
          # CROSS_COMPILE — those trees have dropped the actual gcc compiler
          # binary and ship binutils only, but this kernel's Makefile invokes
          # $(CROSS_COMPILE)gcc directly in several places (plugin/version
          # detection) even though CC=clang does the real compiling. We use
          # Ubuntu's own gcc-aarch64-linux-gnu / gcc-arm-linux-gnueabihf
          # packages instead (installed in the deps step) — they're real,
          # always-available compilers, just with a "-linux-gnu-" instead of
          # "-linux-android-" prefix, which makes no functional difference
          # for building a freestanding kernel image.
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${{ env.CLANG_TAG }}/clang-${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz

          echo "Verifying toolchain binaries exist..."
          test -x clang/bin/clang || { echo "::error:: clang binary missing after extraction"; exit 1; }
          command -v aarch64-linux-gnu-gcc >/dev/null || { echo "::error:: aarch64-linux-gnu-gcc not found (apt install failed?)"; exit 1; }
          command -v arm-linux-gnueabihf-gcc >/dev/null || { echo "::error:: arm-linux-gnueabihf-gcc not found (apt install failed?)"; exit 1; }
          echo "Toolchain OK (clang + real aarch64/arm cross-gcc from apt)."

      - name: Detect Defconfig
        id: detect
        run: |
          cd "$GITHUB_WORKSPACE/source"
          MANUAL="${{ github.event.inputs.defconfig_override }}"

          if [ -n "$MANUAL" ] && [ -f "arch/arm64/configs/$MANUAL" ]; then
            echo "Using manually specified defconfig: $MANUAL"
            echo "defconfig=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Searching arch/arm64/configs/ for a matching config..."
          find arch/arm64/configs/ -maxdepth 1 -name "*defconfig*" | sort

          # Try to auto-match something referencing this SoC/codename before falling back
          MATCH=$(find arch/arm64/configs/ -maxdepth 1 -iname "*6877*defconfig*" | head -n1)
          if [ -z "$MATCH" ]; then
            MATCH=$(find arch/arm64/configs/ -maxdepth 1 -iname "*mtk*defconfig*" | head -n1)
          fi

          if [ -z "$MATCH" ]; then
            echo "::error:: Could not auto-detect a defconfig. Re-run this workflow with"
            echo "::error:: 'defconfig_override' set to one of the filenames listed above"
            echo "::error:: (relative to arch/arm64/configs/, e.g. mt6877-perf_defconfig)."
            exit 1
          fi

          FOUND_NAME=$(basename "$MATCH")
          echo "Auto-detected defconfig: $FOUND_NAME"
          echo "defconfig=$FOUND_NAME" >> "$GITHUB_OUTPUT"

      - name: Auto-Inject Working BPF Patches to Defconfig
        run: |
          cd "$GITHUB_WORKSPACE/source"
          TARGET_CONFIG="arch/arm64/configs/${{ steps.detect.outputs.defconfig }}"

          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "::error:: Detected defconfig vanished unexpectedly: $TARGET_CONFIG"
            exit 1
          fi

          echo "Appending BPF compatibility tweaks to $TARGET_CONFIG ..."
          cat << 'EOF' >> "$TARGET_CONFIG"
          # BPF Android Framework Requirements
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          EOF

      - name: Execute Kernel Compilation
        run: |
          cd "$GITHUB_WORKSPACE/source"

          # Establish path references to toolchain binary nodes.
          # Cross-gcc comes from apt (gcc-aarch64-linux-gnu / gcc-arm-linux-gnueabihf)
          # and is already on PATH system-wide; only clang needs the explicit path.
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"

          # Export targeted variables
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabihf-

          # Clean and compile
          make O=out clean
          make O=out mrproper
          make O=out "${{ steps.detect.outputs.defconfig }}"
          make -j"$(nproc --all)" O=out

      - name: Package with AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"

          # Verify compilation output exists dynamically
          if [ -f "source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp source/out/arch/arm64/boot/Image.gz-dtb "$GITHUB_WORKSPACE/Image.gz-dtb"
            export KERN_FILE="$GITHUB_WORKSPACE/Image.gz-dtb"
          elif [ -f "source/out/arch/arm64/boot/Image.gz" ]; then
            cp source/out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/Image.gz"
            export KERN_FILE="$GITHUB_WORKSPACE/Image.gz"
          else
            echo "::error:: Compilation output target not found! Build failed."
            exit 1
          fi

          # Clone packaging repository
          git clone --depth=1 -b "${{ env.ANYKERNEL_BRANCH }}" "https://github.com/${{ env.ANYKERNEL_REPO }}.git" anykernel
          cp "$KERN_FILE" anykernel/

          # Configure basic installation parameters inside anykernel script layout
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh

          # Generate flashable zip archive artifact
          zip -r9 ../Infinix_Zero5G_2023_Kernel.zip * -x .git* README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero5G-Kernel
          path: Infinix_Zero5G_2023_Kernel.zip
