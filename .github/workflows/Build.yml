name: Build Infinix X6815C Kernel with KernelSU & BPF

on:
  workflow_dispatch: # Allows you to manually click "Run workflow" from the Actions tab

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev clang lld llvm graphviz git zip unzip python3

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com kernel-source
          
      - name: Clone Toolchain (Proton Clang)
        run: |
          mkdir toolchains
          cd toolchains
          # Clones Proton Clang which bundles arm64 and arm Cross-Compilers inside a single repo
          git clone --depth=1 https://github.com clang

      - name: Setup KernelSU
        run: |
          cd kernel-source
          # Integrate KernelSU directly via their official installation script
          curl -LSs "https://githubusercontent.com" | bash -s main

      - name: Patch BPF Configurations
        run: |
          cd kernel-source
          # Config directory check. Change 'vendor/x6815c_defconfig' if your exact defconfig name differs
          TARGET_DEFCONFIG="arch/arm64/configs/vendor/x6815c_defconfig"
          
          echo "Appending BPF configurations to $TARGET_DEFCONFIG..."
          cat <<EOF >> $TARGET_DEFCONFIG
          # BPF Patches for KernelSU / Modules
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_HAVE_EBPF_JIT=y
          CONFIG_BPF_EVENTS=y
          EOF

      - name: Compile Kernel
        run: |
          cd kernel-source
          
          # Add the cloned Clang bin directory directly to path
          export PATH=$(pwd)/../toolchains/clang/bin:$PATH
          
          # Target build flags
          export ARCH=arm64
          export SUBARCH=arm64
          export HEADER_ARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 1. Generate configuration from defconfig
          make O=out vendor/x6815c_defconfig
          
          # 2. Build the target image binaries
          make -j$(nproc --all) O=out

      - name: Package Output (AnyKernel3)
        run: |
          # Clone standard flashing environment zip layout template
          git clone --depth=1 https://github.com AnyKernel3
          
          # Build target directory verification loop
          if [ -f "kernel-source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f "kernel-source/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel-source/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          else
            cp kernel-source/out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          
          # Create compressed recovery installer image archive
          cd AnyKernel3
          zip -r ../Infinix_X6815C_KernelSU_BPF.zip *

      - name: Upload Flashable Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-X6815C-Kernel
          path: Infinix_X6815C_KernelSU_BPF.zip
