name: Build Infinix Zero 5G 2023 Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig_override:
        description: "Exact defconfig filename (leave blank to auto-detect)"
        required: false
        default: ""

env:
  TZ: Asia/Karachi
  KERNEL_REPO: "xiaomi-mediatek-devs/android_kernel_xiaomi_mt6877"
  KERNEL_BRANCH: "lineage-21"
  ANYKERNEL_REPO: "osm0sis/AnyKernel3"
  ANYKERNEL_BRANCH: "master"
  CLANG_VERSION: "r487747c"
  CLANG_TAG: "android-14.0.0_r1"

jobs:
  kernel-compile:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential libncurses5-dev bzip2 libssl-dev \
            flex bison libelf-dev clang lld git zip unzip ccache kmod \
            lib32z1-dev lib32ncurses5-dev

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b "${{ env.KERNEL_BRANCH }}" "https://github.com/${{ env.KERNEL_REPO }}.git" "$GITHUB_WORKSPACE/source"

      - name: Download AOSP Clang & GCC Toolchains
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"

          # Pull official stable Google prebuilt Android Clang components
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/${{ env.CLANG_TAG }}/clang-${{ env.CLANG_VERSION }}.tar.gz" -O clang.tar.gz
          mkdir -p clang && tar -xzf clang.tar.gz -C clang && rm clang.tar.gz

          # Pull standard GNU cross-binutils mappings
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

      - name: Detect Defconfig
        id: detect
        run: |
          cd "$GITHUB_WORKSPACE/source"
          MANUAL="${{ github.event.inputs.defconfig_override }}"

          if [ -n "$MANUAL" ] && [ -f "arch/arm64/configs/$MANUAL" ]; then
            echo "Using manually specified defconfig: $MANUAL"
            echo "defconfig=$MANUAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Searching arch/arm64/configs/ for a matching config..."
          find arch/arm64/configs/ -maxdepth 1 -name "*defconfig*" | sort

          # Try to auto-match something referencing this SoC/codename before falling back
          MATCH=$(find arch/arm64/configs/ -maxdepth 1 -iname "*6877*defconfig*" | head -n1)
          if [ -z "$MATCH" ]; then
            MATCH=$(find arch/arm64/configs/ -maxdepth 1 -iname "*mtk*defconfig*" | head -n1)
          fi

          if [ -z "$MATCH" ]; then
            echo "::error:: Could not auto-detect a defconfig. Re-run this workflow with"
            echo "::error:: 'defconfig_override' set to one of the filenames listed above"
            echo "::error:: (relative to arch/arm64/configs/, e.g. mt6877-perf_defconfig)."
            exit 1
          fi

          FOUND_NAME=$(basename "$MATCH")
          echo "Auto-detected defconfig: $FOUND_NAME"
          echo "defconfig=$FOUND_NAME" >> "$GITHUB_OUTPUT"

      - name: Auto-Inject Working BPF Patches to Defconfig
        run: |
          cd "$GITHUB_WORKSPACE/source"
          TARGET_CONFIG="arch/arm64/configs/${{ steps.detect.outputs.defconfig }}"

          if [ ! -f "$TARGET_CONFIG" ]; then
            echo "::error:: Detected defconfig vanished unexpectedly: $TARGET_CONFIG"
            exit 1
          fi

          echo "Appending BPF compatibility tweaks to $TARGET_CONFIG ..."
          cat << 'EOF' >> "$TARGET_CONFIG"
          # BPF Android Framework Requirements
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_CGROUP_BPF=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_SECURITY_SELINUX_DEVELOP=y
          EOF

      - name: Execute Kernel Compilation
        run: |
          cd "$GITHUB_WORKSPACE/source"

          # Establish path references to toolchain binary nodes
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"

          # Export targeted variables
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-

          # Clean and compile
          make O=out clean
          make O=out mrproper
          make O=out "${{ steps.detect.outputs.defconfig }}"
          make -j"$(nproc --all)" O=out

      - name: Package with AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"

          # Verify compilation output exists dynamically
          if [ -f "source/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp source/out/arch/arm64/boot/Image.gz-dtb "$GITHUB_WORKSPACE/Image.gz-dtb"
            export KERN_FILE="$GITHUB_WORKSPACE/Image.gz-dtb"
          elif [ -f "source/out/arch/arm64/boot/Image.gz" ]; then
            cp source/out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/Image.gz"
            export KERN_FILE="$GITHUB_WORKSPACE/Image.gz"
          else
            echo "::error:: Compilation output target not found! Build failed."
            exit 1
          fi

          # Clone packaging repository
          git clone --depth=1 -b "${{ env.ANYKERNEL_BRANCH }}" "https://github.com/${{ env.ANYKERNEL_REPO }}.git" anykernel
          cp "$KERN_FILE" anykernel/

          # Configure basic installation parameters inside anykernel script layout
          cd anykernel
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel.sh

          # Generate flashable zip archive artifact
          zip -r9 ../Infinix_Zero5G_2023_Kernel.zip * -x .git* README.md

      - name: Upload Flashable Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero5G-Kernel
          path: Infinix_Zero5G_2023_Kernel.zip
