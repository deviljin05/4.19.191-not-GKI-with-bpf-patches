name: Build 4.19 Non-GKI Kernel (Google ACK, BPF-enabled, ColorOS Port)

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: 'Google Android Common Kernel (ACK) - official, GPL source'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      KERNEL_BRANCH:
        description: 'ACK 4.19 non-GKI branch (now under deprecated/ prefix)'
        required: true
        default: 'deprecated/android-4.19-stable'
      DEFCONFIG:
        description: 'Defconfig name - "defconfig" is the generic ACK 4.19 config (no device-specific drivers). Check the "List available defconfigs" step output if build fails.'
        required: true
        default: 'defconfig'
      DEVICE_NAME:
        description: 'Device codename (used for zip naming)'
        required: true
        default: 'X6815C'
      ARCH:
        description: 'Target architecture'
        required: true
        default: 'arm64'
      ANYKERNEL_REPO:
        description: 'AnyKernel3 repo URL'
        required: true
        default: 'https://github.com/osm0sis/AnyKernel3'
      ANYKERNEL_BRANCH:
        description: 'AnyKernel3 branch'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workflow repo (for local patches folder, if any)
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex \
            git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3 llvm lld clang \
            libc6-dev-i386 device-tree-compiler

      - name: Clone Google ACK 4.19 kernel source
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.KERNEL_BRANCH }}" \
            "${{ github.event.inputs.KERNEL_REPO }}" kernel_source

      - name: List available defconfigs (IMPORTANT - confirm correct DEFCONFIG name before real run)
        run: |
          find kernel_source -path "*/configs/*defconfig*" | head -n 60

      - name: Clone AnyKernel3
        run: |
          git clone --depth=1 -b "${{ github.event.inputs.ANYKERNEL_BRANCH }}" \
            "${{ github.event.inputs.ANYKERNEL_REPO }}" AnyKernel3

      - name: Apply local patches (optional, from patches/ folder in this repo)
        run: |
          if [ -d "patches" ] && [ -n "$(ls -A patches/*.patch 2>/dev/null)" ]; then
            cd kernel_source
            for p in ../patches/*.patch; do
              echo "Applying $p"
              git apply --whitespace=fix "$p" || patch -p1 < "$p"
            done
          else
            echo "No patches/*.patch found, skipping."
          fi

      - name: Verify / force-enable BPF configs (needed for ColorOS-ported ROM netd/network on Android 10+)
        run: |
          cd kernel_source
          CFG=$(find . -path "*/configs/${{ github.event.inputs.DEFCONFIG }}" | head -n1)
          if [ -z "$CFG" ]; then
            echo "ERROR: defconfig '${{ github.event.inputs.DEFCONFIG }}' not found in this branch."
            echo "Check the 'List available defconfigs' step output above and re-run with a valid name."
            exit 1
          fi
          echo "Using defconfig: $CFG"
          scripts/config --file "$CFG" \
            -e BPF \
            -e BPF_SYSCALL \
            -e BPF_JIT \
            -e HAVE_EBPF_JIT \
            -e CGROUP_BPF \
            -e BPF_EVENTS \
            -e NETFILTER_XT_MATCH_BPF \
            -e NET_CLS_BPF \
            -e NET_ACT_BPF \
            -e IKCONFIG \
            -e IKCONFIG_PROC || true
          grep -E "CONFIG_BPF|CONFIG_CGROUP_BPF" "$CFG"

      - name: Set up toolchain (Clang + GCC, AOSP prebuilt)
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 toolchains/clang
          CLANG_BIN=$(find toolchains/clang -maxdepth 1 -type d -name "clang-r*" | head -n1)
          echo "CLANG_BIN=$GITHUB_WORKSPACE/$CLANG_BIN/bin" >> $GITHUB_ENV
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchains/gcc64
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchains/gcc32
          echo "GCC64_PATH=$GITHUB_WORKSPACE/toolchains/gcc64" >> $GITHUB_ENV
          echo "GCC32_PATH=$GITHUB_WORKSPACE/toolchains/gcc32" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd kernel_source
          export ARCH=${{ github.event.inputs.ARCH }}
          export SUBARCH=${{ github.event.inputs.ARCH }}
          export KBUILD_BUILD_USER="ci"
          export KBUILD_BUILD_HOST="github-actions"
          export PATH="$CLANG_BIN:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
          MAKE_ARGS="CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$GCC64_PATH/bin/aarch64-linux-android- CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-linux-androideabi-"

          make O=out $MAKE_ARGS ${{ github.event.inputs.DEFCONFIG }}
          make O=out $MAKE_ARGS -j$(nproc --all)

      - name: Package into AnyKernel3 zip
        run: |
          IMG=$(find kernel_source/out/arch/${{ github.event.inputs.ARCH }}/boot -maxdepth 1 -name "Image*" | head -n1)
          cp "$IMG" AnyKernel3/Image.gz-dtb 2>/dev/null || cp "$IMG" AnyKernel3/Image
          cd AnyKernel3
          ZIP_NAME="ACK419-Kernel-${{ github.event.inputs.DEVICE_NAME }}-$(date +%Y%m%d-%H%M).zip"
          zip -r9 "../$ZIP_NAME" . -x ".git*" "README.md"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
