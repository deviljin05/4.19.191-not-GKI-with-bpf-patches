name: Build X6815C Kernel (Production MTK)

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/rag12ghu-design/android_kernel_infinix_X6815C"
      kernel_branch:
        description: "Kernel branch"
        required: false
        default: "main"
      enable_bpf:
        description: "Enable BPF configs (Patches optional, skip if missing)"
        type: boolean
        default: true
      release:
        description: "Publish a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  ARCH: arm64
  SUBARCH: arm64
  KBUILD_BUILD_USER: github-actions
  KBUILD_BUILD_HOST: x6815c-ci
  TZ: Asia/Karachi

jobs:
  build:
    name: Build kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git libssl-dev \
            libelf-dev libncurses-dev lz4 python3 rsync unzip zip xz-utils \
            device-tree-compiler binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi zstd

      - name: Clone kernel source
        env:
          REPO: ${{ inputs.kernel_repo }}
          BRANCH: ${{ inputs.kernel_branch }}
        run: |
          if [ -n "$BRANCH" ]; then
            git clone --depth=1 -b "$BRANCH" "$REPO" kernel
          else
            git clone --depth=1 "$REPO" kernel
          fi

      - name: Safe Vendor Fixes (Conditional)
        working-directory: kernel
        run: |
          echo "=========================================="
          echo "Applying conditional fixes..."
          echo "=========================================="

          if [ -d "drivers/kernelsu" ]; then
            echo "Removing KernelSU..."
            rm -rf drivers/kernelsu
            sed -i '/drivers\/kernelsu/d' drivers/Kconfig 2>/dev/null || true
            sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          fi

          WLAN_MK="drivers/misc/mediatek/connectivity/wlan/core/gen4m/Makefile"
          if [ -f "$WLAN_MK" ]; then
            echo "Fixing WLAN HIF config..."
            if grep -q "CONFIG_WIFI_HIF" "$WLAN_MK"; then
              sed -i 's/^CONFIG_WIFI_HIF=.*/CONFIG_WIFI_HIF=sdio/' "$WLAN_MK" || true
            fi
            if grep -q "WIFI_HIF" "$WLAN_MK"; then
              sed -i 's/^WIFI_HIF=.*/WIFI_HIF=sdio/' "$WLAN_MK" || true
            fi
            if grep -q "HIF" "$WLAN_MK"; then
              sed -i 's/^HIF=.*/HIF=sdio/' "$WLAN_MK" || true
            fi
          fi

          echo "Conditional fixes complete."

      - name: Resolve defconfig
        working-directory: kernel
        run: |
          DC=$(ls arch/arm64/configs | grep -iE 'x6815c|6877' | head -n1 || true)
          if [ -z "$DC" ]; then
            DC=$(ls arch/arm64/configs | grep -iE 'defconfig' | head -n1 || true)
          fi
          if [ -z "$DC" ]; then
            echo "::error::No defconfig found in arch/arm64/configs/"
            ls arch/arm64/configs/
            exit 1
          fi
          echo "DEFCONFIG=$DC" >> "$GITHUB_ENV"
          echo "Using Defconfig: $DC"

      - name: Set up toolchain (Proton-Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang "$HOME/clang"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-x6815c-${{ github.run_id }}
          restore-keys: ccache-x6815c-

      - name: Apply BPF patches (Optional, skip if missing)
        if: ${{ inputs.enable_bpf }}
        working-directory: kernel
        run: |
          PATCH_DIR="$GITHUB_WORKSPACE/patches/bpf"
          if [ ! -d "$PATCH_DIR" ]; then
            echo "::warning::patches/bpf/ directory not found. Skipping BPF patches."
            exit 0
          fi

          shopt -s nullglob
          PATCHES=("$PATCH_DIR"/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "::warning::No .patch files in patches/bpf/. Skipping BPF patches."
            exit 0
          fi

          for p in "${PATCHES[@]}"; do
            echo "Applying: $(basename $p)"
            git apply "$p" || echo "::warning::Patch failed: $p (continuing anyway)"
          done

      - name: Configure kernel
        working-directory: kernel
        env:
          BPF: ${{ inputs.enable_bpf }}
        run: |
          cat > ci.config <<'EOF'
          CONFIG_MODULE_SIG=n
          CONFIG_SYSTEM_TRUSTED_KEYS=""
          CONFIG_DEBUG_INFO=n
          CONFIG_LTO_NONE=y
          CONFIG_WERROR=n
          CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          CONFIG_MODULES=y
          EOF

          if [ "$BPF" = "true" ]; then
            cat >> ci.config <<'EOF'
          CONFIG_BPF=y
          CONFIG_BPF_SYSCALL=y
          CONFIG_BPF_JIT=y
          CONFIG_BPF_JIT_ALWAYS_ON=y
          CONFIG_BPF_EVENTS=y
          CONFIG_CGROUP_BPF=y
          CONFIG_NET_CLS_BPF=y
          CONFIG_NET_ACT_BPF=y
          CONFIG_NET_CLS_ACT=y
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_INGRESS=y
          CONFIG_NETFILTER_XT_MATCH_BPF=y
          EOF
          fi

          sed -i 's/^ *//' ci.config
          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"
          scripts/kconfig/merge_config.sh -m -O out out/.config ci.config
          make O=out ARCH=arm64 CC=clang olddefconfig

      - name: Build kernel & Modules
        working-directory: kernel
        run: |
          set -o pipefail
          export CCACHE_DIR="$HOME/.ccache"

          make -j"$(nproc)" O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-Wno-error -Wno-deprecated-declarations" \
            2>&1 | tee build.log

      - name: Collect Outputs (Image, DTB, Modules)
        working-directory: kernel
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          B=out/arch/arm64/boot
          D="$GITHUB_WORKSPACE/dist"

          if [ -f "$B/Image.gz-dtb" ]; then
            cp "$B/Image.gz-dtb" "$D/"
          elif [ -f "$B/Image.gz" ]; then
            cp "$B/Image.gz" "$D/"
            [ -f "$B/dtb" ] && cp "$B/dtb" "$D/dtb"
          elif [ -f "$B/Image" ]; then
            cp "$B/Image" "$D/"
          else
            echo "::error::No Kernel Image produced. Check build.log"
            exit 1
          fi

          find out -name "*.ko" -exec cp {} "$D/" \; 2>/dev/null || true
          cp out/.config "$D/final.config"
          echo "KVER=$(make -s kernelversion)" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 (Modules + DTB)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          D="$GITHUB_WORKSPACE/dist"

          if [ -f "$D/Image.gz-dtb" ]; then cp "$D/Image.gz-dtb" ak3/;
          elif [ -f "$D/Image.gz" ]; then cp "$D/Image.gz" ak3/;
          else cp "$D/Image" ak3/; fi

          [ -f "$D/dtb" ] && cp "$D/dtb" ak3/

          if ls "$D"/*.ko >/dev/null 2>&1; then
            mkdir -p ak3/modules && cp "$D"/*.ko ak3/modules/
          fi

          sed -i \
            -e "s|^kernel.string=.*|kernel.string=X6815C ${KVER} (Production)|" \
            -e "s|^do.devicecheck=.*|do.devicecheck=0|" \
            -e "s|^do.modules=.*|do.modules=1|" \
            -e "s|^BLOCK=.*|BLOCK=boot;|" \
            ak3/anykernel.sh

          ZIP="X6815C-${KVER}-Production.zip"
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/dist/$ZIP" . -x '*.git*')

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X6815C-production-build
          path: dist/*

      - name: Upload Build Log (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log
