name: Build Infinix Zero 5G 2023 Custom Kernel
on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: 'Direct link or Google Drive share link to your original boot.img'
        required: false
        default: 'https://drive.google.com/file/d/1p8teKTyefbW5VNIpMSZdXMqvVNfQ8fUI/view?usp=drive_link'

# ============================================================================
# HOW TO PROVIDE YOUR ORIGINAL BOOT IMAGE (pick ONE):
#
# Option A (recommended for big files): upload boot.img as a GitHub Release
# asset (Releases support up to 2GB, no Git LFS needed), copy its direct
# download link, and paste that link into the "boot_img_url" input when you
# run this workflow (Actions tab -> Run workflow).
#
# Option B: commit the file to the repo root yourself as boot_original.img
# and leave boot_img_url blank.
#
# Either way, this workflow unpacks it to pull out the original ramdisk,
# DTB, and header arguments (cmdline, base address, page size, offsets,
# etc.) so the final repacked boot.img matches what your device expects.
# ============================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 5120
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Extra Manual Cleanup (belt and suspenders)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf libssl-dev libelf-dev libncurses5-dev rsync zip lz4 liblz4-tool \
            device-tree-compiler python3 python3-pip cpio

      - name: Get Original Boot Image
        run: |
          pip install --break-system-packages --quiet gdown

          if [ -f "boot_original.img" ]; then
            echo "Found boot_original.img already in repo ($(du -h boot_original.img | cut -f1))"
          elif [ -n "${{ github.event.inputs.boot_img_url }}" ]; then
            URL="${{ github.event.inputs.boot_img_url }}"
            echo "Downloading boot_original.img from provided URL..."

            if echo "$URL" | grep -q "drive.google.com"; then
              FILE_ID=$(echo "$URL" | grep -oP '(?<=/d/)[^/]+' || echo "$URL" | grep -oP '(?<=id=)[^&]+')
              echo "Detected Google Drive link, file ID: $FILE_ID"
              gdown "https://drive.google.com/uc?id=$FILE_ID" -O boot_original.img
            else
              curl -L "$URL" -o boot_original.img
            fi

            if [ ! -s "boot_original.img" ]; then
              echo "ERROR: download failed or produced an empty file."
              exit 1
            fi
            echo "Downloaded boot_original.img ($(du -h boot_original.img | cut -f1))"
          else
            echo "ERROR: boot_original.img not found in repo, and no boot_img_url input was provided."
            exit 1
          fi

      - name: Clone Verified MT6893 Kernel Source
        run: |
          git clone https://github.com/xiaomi-mt6893-dev/kernel_xiaomi_mt6893 --depth=1 source

      - name: Download Stable Proton Clang Compiler
        run: |
          git clone https://github.com/kdrag0n/proton-clang --depth=1 toolchain

      - name: List Available Defconfigs (diagnostic)
        run: |
          cd source
          echo "=== Available defconfigs in this source tree ==="
          ls -la arch/arm64/configs/

      - name: Auto-Inject eBPF & Port ROM Patches to Defconfig
        run: |
          cd source
          TARGET_CONFIG="arch/arm64/configs/pissarro_defconfig"

          if [ -f "$TARGET_CONFIG" ]; then
            echo "" >> $TARGET_CONFIG
            echo "# --- eBPF / KernelSU Compulsory Patches ---" >> $TARGET_CONFIG
            echo "CONFIG_BPF=y" >> $TARGET_CONFIG
            echo "CONFIG_BPF_SYSCALL=y" >> $TARGET_CONFIG
            echo "CONFIG_BPF_JIT=y" >> $TARGET_CONFIG
            echo "CONFIG_BPF_JIT_ALWAYS_ON=y" >> $TARGET_CONFIG
            echo "CONFIG_HAVE_EBPF_JIT=y" >> $TARGET_CONFIG
            echo "CONFIG_NET_CLS_ACT=y" >> $TARGET_CONFIG
            echo "CONFIG_NET_CLS_BPF=y" >> $TARGET_CONFIG
            echo "CONFIG_NET_ACT_BPF=y" >> $TARGET_CONFIG
            echo "CONFIG_CGROUP_BPF=y" >> $TARGET_CONFIG
            echo "CONFIG_IKCONFIG=y" >> $TARGET_CONFIG
            echo "CONFIG_IKCONFIG_PROC=y" >> $TARGET_CONFIG

            echo "# --- Port ROMs & Permissive Fail-Safe Patches ---" >> $TARGET_CONFIG
            echo "CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE=0" >> $TARGET_CONFIG
            echo "CONFIG_DM_DEFAULT_KEY=n" >> $TARGET_CONFIG
            echo "CONFIG_NAMESPACES=y" >> $TARGET_CONFIG
            echo "CONFIG_USER_NS=y" >> $TARGET_CONFIG
            echo "CONFIG_PID_NS=y" >> $TARGET_CONFIG
            echo "CONFIG_NET_NS=y" >> $TARGET_CONFIG
            echo "# CONFIG_DM_VERITY_FEC is not set" >> $TARGET_CONFIG

            echo "# --- Disable APUSYS (AI processing unit) driver ---" >> $TARGET_CONFIG
            echo "# This subsystem's tracepoint headers (mnoc_met_events.h) hit a" >> $TARGET_CONFIG
            echo "# real 'undeclared identifier' compile error unrelated to compiler" >> $TARGET_CONFIG
            echo "# choice, and we don't need NPU/AI-accelerator support for a" >> $TARGET_CONFIG
            echo "# working phone kernel, so we disable it outright." >> $TARGET_CONFIG
            echo "# CONFIG_MTK_APUSYS_SUPPORT is not set" >> $TARGET_CONFIG
            echo "# CONFIG_MTK_APUSYS is not set" >> $TARGET_CONFIG
            echo "# CONFIG_MTK_APU_SUPPORT is not set" >> $TARGET_CONFIG

            echo "Successfully injected patches into pissarro_defconfig."
          else
            echo "ERROR: Base config file not found! Check the diagnostic step output above."
            exit 1
          fi

      - name: Compile Custom Kernel Image
        run: |
          cd source
          # toolchain goes AFTER the system PATH, not before: plain "gcc"/"ld"
          # (used to build HOST tools like fixdep, which run on the runner
          # itself) must resolve to the runner's own up-to-date binutils.
          # proton-clang's bundled ld is older and chokes on the runner's
          # newer glibc (.relr.dyn RELR sections) if picked up for host
          # builds. The aarch64-linux-gnu-* cross tools are uniquely named
          # (no system equivalent), so they still resolve correctly from
          # toolchain/bin even at the end of PATH.
          export PATH="$PATH:$(pwd)/../toolchain/bin"
          export ARCH=arm64
          export SUBARCH=arm64

          # Relax implicit-function-declaration from a hard error (-Werror)
          # back to a warning — some legacy vendor driver files (e.g. the
          # bundled Goodix touchscreen driver) are missing an include that
          # clang treats more strictly than GCC did originally.
          export KCFLAGS="-Wno-error=implicit-function-declaration"

          make O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang pissarro_defconfig
          # Build only Image.gz — we reuse the ORIGINAL device's dtb/dtbo
          # straight from boot_original.img during the repack step later, so
          # we don't need a freshly built dtbo.img (which also fails here
          # since it calls "python2", not installed on modern Ubuntu).
          make O=out CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CC=clang -j$(nproc) Image.gz

      - name: Check Kernel Compilation Output
        run: |
          cd source/out/arch/arm64/boot/
          if [ -f "Image.gz" ]; then
            echo "Compilation successful!"
          else
            echo "ERROR: Kernel binary compilation failed!"
            exit 1
          fi

      - name: Unpack Original Boot Image
        run: |
          git clone https://android.googlesource.com/platform/system/tools/mkbootimg mkbootimg_tools

          mkdir -p unpacked
          python3 mkbootimg_tools/unpack_bootimg.py --boot_img boot_original.img --out unpacked --format mkbootimg | tee unpacked/repack_args.txt

          echo "=== Unpacked contents ==="
          ls -la unpacked/
          echo "=== Captured repack arguments ==="
          cat unpacked/repack_args.txt

      - name: Repack Boot Image with New Kernel
        run: |
          NEW_KERNEL="source/out/arch/arm64/boot/Image.gz"

          if [ ! -f "$NEW_KERNEL" ]; then
            echo "ERROR: new kernel image not found at $NEW_KERNEL"
            exit 1
          fi

          REPACK_CMD=$(cat unpacked/repack_args.txt | sed "s#--kernel [^ ]*#--kernel $NEW_KERNEL#")

          echo "=== Final repack command ==="
          echo "python3 mkbootimg_tools/mkbootimg.py $REPACK_CMD --output boot_new.img"

          python3 mkbootimg_tools/mkbootimg.py $REPACK_CMD --output boot_new.img

          if [ -f "boot_new.img" ]; then
            echo "boot_new.img created successfully ($(du -h boot_new.img | cut -f1))"
          else
            echo "ERROR: repack failed, boot_new.img not produced"
            exit 1
          fi

      - name: Upload Kernel Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero-5G-2023-Kernel-Image
          path: source/out/arch/arm64/boot/Image.gz

      - name: Upload Flashable Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: Infinix-Zero-5G-2023-boot-new
          path: boot_new.img
